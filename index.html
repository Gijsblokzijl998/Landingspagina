<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Beveiligingsregel (CSP): alleen de twee ingebouwde scripts (vastgelegd met hun SHA-256), Open-Meteo, de Worker
    op workers.dev en afbeeldingen via https/data/blob/file. Na het wijzigen van een script: node tests/check-csp.mjs --fix
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-0rmtLU0ARXSsrvNsuB+4/Bmhz0qNOt8iOlmRWEBipkk=' 'sha256-9rAqvLy0frD7BQ1+zsy6M27eYBDC8b+KuzOXteKfWCQ='; style-src 'unsafe-inline'; img-src https: data: blob: file:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Mijn Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%232563eb'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
  <script>
    // Thema vóór de eerste paint zetten, zodat er geen witte flits is (sleutel = STORAGE_KEYS.theme).
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('lp:theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    /* ======================================================================
       Thema (CSS custom properties)
       ====================================================================== */
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-hover: #f6f8fb;
      --border: #e1e5ed;
      --text: #141821;
      --text-muted: #5b6474;
      --accent: #2563eb;
      --accent-text: color-mix(in srgb, var(--accent) 85%, black);
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --danger: #c62828;
      --success: #2e7d32;
      --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 2px 8px rgb(16 24 40 / .06);
      --shadow-hover: 0 4px 10px rgb(16 24 40 / .08), 0 14px 28px rgb(16 24 40 / .10);
      --backdrop: rgb(15 18 25 / .45);

      --radius: 16px;
      --radius-sm: 12px;
      --gap: 16px;
      --page-pad: clamp(16px, 4vw, 40px);
      --chrome-h: 160px; /* kopbalk + voetbalk + marges: begrenst de tegelhoogte */
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0d1016;
      --surface: #161a22;
      --surface-hover: #1d222c;
      --border: #272d39;
      --text: #e7eaf0;
      --text-muted: #9aa3b2;
      --accent-text: color-mix(in srgb, var(--accent) 55%, white);
      --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent);
      --danger: #f87171;
      --success: #6fcf86;
      --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 2px 8px rgb(0 0 0 / .25);
      --shadow-hover: 0 6px 14px rgb(0 0 0 / .4), 0 16px 32px rgb(0 0 0 / .35);
      --backdrop: rgb(0 0 0 / .6);
      color-scheme: dark;
    }

    [data-tile-style="square"] {
      --radius: 4px;
      --radius-sm: 3px;
    }

    /* ======================================================================
       Basis
       ====================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--page-bg, var(--bg));
      color: var(--text);
      font: 15px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      flex: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, background-color .15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-hover); }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-background="image"] body {
      background: var(--bg) var(--page-bg-image) center / cover no-repeat fixed;
    }


    .icon {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: .8125rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-hover); }
    .btn--primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    .btn--danger { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger); }
    .btn--danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }

    .muted { color: var(--text-muted); }

    .toast {
      inset: auto auto 64px 50%; /* boven de voetbalk */
      max-width: min(480px, 100vw - 32px);
      margin: 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow-hover);
      font-size: .9rem;
      transform: translateX(-50%);
    }
    .toast:popover-open { animation: toast-in .2s ease-out; }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
    }

    /* ======================================================================
       Header
       ====================================================================== */
    /* Kop- en voetbalk: rustig grijs, kleine tekst, met een scheidingslijn naar de inhoud. */
    .site-header,
    .site-footer {
      position: sticky;
      z-index: 5;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(10px);
    }

    .site-header {
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas: "left center right";
      align-items: center;
      gap: 16px;
      min-height: 52px;
      padding: 8px 16px 8px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .8rem;
    }
    .header-left { grid-area: left; display: flex; align-items: center; gap: 10px; min-width: 0; }
    /* Titel en welkomsttekst staan samen, naast elkaar, precies in het midden. */
    .header-center {
      grid-area: center;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }
    .header-right {
      grid-area: right;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Ruimte en een lijn tussen weer/klok en de knoppen voor thema en instellingen. */
    .header-buttons {
      display: flex;
      gap: 2px;
      margin-left: 14px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .logo { display: block; max-width: 140px; max-height: 30px; object-fit: contain; }

    .page-title {
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.005em;
      line-height: 1.3;
    }
    .welcome { padding-left: 12px; border-left: 1px solid var(--border); font-size: .85rem; white-space: nowrap; }

    .weather {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      line-height: 1.2;
      text-align: right;
    }
    .weather.is-stale { opacity: .55; }
    .weather-icon { display: grid; }
    .weather-icon .icon { width: 22px; height: 22px; }
    .weather-text { display: flex; flex-direction: column; align-items: flex-end; }
    .weather-temp { color: var(--text); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .weather-place { max-width: 140px; overflow: hidden; font-size: .72rem; white-space: nowrap; text-overflow: ellipsis; }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 0 8px;
      border-left: 1px solid var(--border);
      line-height: 1.2;
    }
    .clock-time { color: var(--text); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .clock-date { display: block; font-size: .72rem; }
    .clock-date::first-letter { text-transform: uppercase; }

    /* De themaknop toont wat je krijgt: een maan in licht thema, een zon in donker thema. */
    [data-theme="dark"] .icon-moon,
    :root:not([data-theme="dark"]) .icon-sun { display: none; }

    @media (max-width: 720px) {
      .site-header {
        grid-template-columns: auto 1fr;
        grid-template-areas: "left right" "center center";
        row-gap: 6px;
      }
      .header-center { justify-content: flex-start; }
      .header-buttons { margin-left: 4px; padding-left: 6px; }
    }

    @media (max-width: 480px) {
      .weather-place, .clock-date { display: none; }
    }

    /* ======================================================================
       Hoofdcontainer en tegelgrid
       ====================================================================== */
    #mainContainer {
      flex: 1;
      container: main / inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px var(--page-pad) 24px;
    }

    .grid {
      --cols: var(--cfg-cols, 4);
      --rows: var(--fit-rows, 4);
      /* Vierkante cellen: zo groot als de breedte en de vensterhoogte (voor de gebruikte rijen) toelaten. */
      --tile: clamp(80px, min(
        (100cqi - (var(--cols) - 1) * var(--gap)) / var(--cols),
        (100dvh - var(--chrome-h) - (var(--rows) - 1) * var(--gap)) / var(--rows)
      ), 210px);
      /* Rijen van een halve tegel: een gewone tegel beslaat er twee, een halve tegel één. */
      --half: calc((var(--tile) - var(--gap)) / 2);
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--tile));
      grid-auto-rows: var(--half);
      grid-auto-flow: row dense;
      justify-content: center;
      gap: var(--gap);
      max-width: 100%;
    }
    /* Positie en grootte komen uit de indeling (layoutTiles). */
    .grid > .tile,
    .grid > .drop-ghost {
      grid-column: var(--col, auto) / span var(--span-cols, 1);
      grid-row: var(--row, auto) / span var(--span-rows, 2);
    }

    @container main (max-width: 600px) {
      .grid {
        --cols: 2;
        --gap: 12px;
        --tile: calc((100cqi - var(--gap)) / 2);
      }
      /* Smal venster: twee kolommen, tegels in volgorde onder elkaar (vrije posities gelden dan niet). */
      .grid > .tile { grid-column: auto / span var(--span-cols-narrow, 1); grid-row: auto / span var(--span-rows, 2); }
    }

    .grid-empty {
      grid-column: 1 / -1;
      align-self: center;
      text-align: center;
      color: var(--text-muted);
    }

    /* ======================================================================
       Tegels
       ====================================================================== */
    .tile {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .tile--link {
      position: relative;
      padding: 0;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .tile--link:not(.is-invalid):hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: color-mix(in srgb, var(--tile-color, var(--text-muted)) 45%, var(--border));
    }
    .tile--link.is-invalid { opacity: .55; }

    .tile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 0;
      padding: 14px;
      border: 0;
      border-radius: inherit;
      background: none;
      color: inherit;
      font: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .is-invalid .tile-main { cursor: default; }
    .tile-main:focus-visible { outline-offset: -3px; }

    .tile-hint {
      max-width: 100%;
      margin-top: -4px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: .75rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tile-action {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    .tile:hover .tile-action,
    .tile-action:focus-visible { opacity: 1; }
    .tile-action:hover { background: var(--surface-hover); color: var(--text); }
    @media (hover: none) {
      .tile-action { opacity: 1; }
    }

    .tile-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--tile-color, var(--text-muted)) 11%, transparent);
      color: var(--tile-color, var(--text-muted));
      font-size: 28px;
      line-height: 1;
    }
    .tile-icon .icon { width: 28px; height: 28px; }
    .tile-icon--letter { font-size: 24px; font-weight: 600; }
    /* Emoji's ook in grijstinten, passend bij de lijniconen. */
    .emoji-icon { filter: grayscale(1); }

    .tile-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .tile-heading {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      font-weight: 600;
    }
    .tile-heading span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tile-heading .icon { width: 15px; height: 15px; }

    .tile-body:focus-visible { outline-offset: 2px; border-radius: 6px; }
    .tile-body {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .tile-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .tile-list a,
    .tile-list .is-invalid {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 6px;
      overflow: hidden;
      border-radius: 6px;
      font-size: .82rem;
      line-height: 1.35;
      text-decoration: none;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tile-list a:hover { background: var(--accent-soft); color: var(--accent-text); }
    .link-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* Favicons staan grijs; bij aanwijzen of focus krijgen ze hun kleur. */
    .favicon {
      flex: none;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      filter: grayscale(1);
      opacity: .8;
      transition: filter .2s, opacity .2s;
    }
    a:is(:hover, :focus-visible) > .favicon,
    .tile:hover :is(.tile-heading, .tile-icon) > .favicon,
    .tile:hover .tile-heading > span > .favicon { filter: none; opacity: 1; }
    .tile-icon > .favicon { width: 28px; height: 28px; border-radius: 6px; }
    .tile-icon > .favicon--letter { font-size: 14px; }
    /* Laatste terugval als geen enkele bron een favicon levert: de eerste letter van het domein. */
    .favicon--letter {
      display: inline-grid;
      place-items: center;
      background: var(--surface-hover);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }
    .tile-list .is-invalid { color: var(--text-muted); text-decoration: line-through; }

    .tile-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      text-align: center;
    }

    .tile-state.is-error { color: var(--danger); }

    .tile--rss { padding-top: 11px; padding-bottom: 9px; }
    .tile--rss .tile-heading { margin-bottom: 4px; }
    .feed-list { display: grid; margin: 0; padding: 0; list-style: none; }
    .feed-item {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: baseline;
      gap: 6px;
      padding: 1px 6px;
      border-radius: 5px;
      text-decoration: none;
    }
    a.feed-item:hover { background: var(--surface-hover); }
    a.feed-item:hover .feed-title { color: var(--text); }
    .feed-title {
      overflow: hidden;
      color: color-mix(in srgb, var(--text) 85%, var(--text-muted));
      font-size: .74rem;
      line-height: 1.28;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .feed-meta { color: var(--accent-text); font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .feed-stale { margin-top: 6px; color: var(--text-muted); font-size: .7rem; font-style: italic; }


    .tile.has-background {
      background-image:
        linear-gradient(color-mix(in srgb, var(--surface) var(--tile-dim), transparent), color-mix(in srgb, var(--surface) var(--tile-dim), transparent)),
        var(--tile-background);
      background-position: center;
      background-size: cover;
    }
    .tile.has-background .tile-icon { background: color-mix(in srgb, var(--surface) 70%, transparent); }
    .tile.has-background .agenda-date { background: none; }

    /* Agenda */
    /* Eén tijdkolom voor alle dagen (subgrid), zo breed als de langste tijd. */
    .agenda { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; }
    .agenda-day, .agenda-list, .agenda-item { grid-column: 1 / -1; grid-template-columns: subgrid; row-gap: 0; }
    .agenda-day { display: grid; }
    .agenda-date { grid-column: 1 / -1; }
    .agenda-date {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 1px 0 2px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: .72rem;
      font-weight: 600;
    }
    .agenda-list { display: grid; margin: 0; padding: 0; list-style: none; }
    .agenda-item {
      display: grid;
      padding: 1px 6px;
      border-left: 2px solid transparent;
      border-radius: 4px;
      font-size: .8rem;
      line-height: 1.3;
    }
    /* Afgelopen afspraken grijs (met voldoende contrast), niet doorzichtig. */
    .agenda-item.is-past .agenda-title { color: var(--text-muted); }
    .agenda-item.is-past .agenda-time { text-decoration: line-through; }
    .agenda-item.is-now { border-left-color: var(--text-muted); background: var(--surface-hover); }
    .agenda-time { padding-top: 1px; color: var(--accent-text); font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .agenda-item.is-past .agenda-time { color: var(--text-muted); font-weight: 400; }
    .agenda-text { display: grid; min-width: 0; }
    .agenda-title, .agenda-location { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .agenda-location { color: var(--text-muted); font-size: .7rem; }

    /* Verslepen */
    .grid > [draggable="true"] { cursor: grab; }
    .grid.is-sorting .tile { transition: none; }
    .grid.is-sorting .tile--link:hover { transform: none; box-shadow: var(--shadow); }
    .tile.is-dragging { opacity: .35; outline: 2px dashed var(--text-muted); outline-offset: -2px; }
    .drop-ghost {
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      background: var(--accent-soft);
      pointer-events: none;
    }

    /* Halve tegel: icoon en titel naast elkaar. */
    .tile--half .tile-main { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 8px 12px; text-align: left; }
    .tile--half .tile-icon { width: 34px; height: 34px; font-size: 18px; }
    .tile--half .tile-icon .icon { width: 18px; height: 18px; }
    .tile--half .tile-icon > .favicon { width: 20px; height: 20px; border-radius: 4px; }
    .tile--half .tile-icon--letter { font-size: 16px; }
    .tile--half .tile-title { -webkit-line-clamp: 1; font-size: .88rem; }
    .tile--half .tile-hint { display: none; }
    .tile--half .tile-action { top: 50%; width: 26px; height: 26px; transform: translateY(-50%); }
    .tile--half:not(.is-invalid):hover { transform: translateY(-1px); }

    /* ======================================================================
       Snelle links
       ====================================================================== */
    .site-footer {
      bottom: 0;
      border-top: 1px solid var(--border);
    }
    .quick-links {
      display: flex;
      gap: 18px;
      padding: 8px var(--page-pad);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    /* Gecentreerd als alles past, gewoon scrollbaar als het niet past. */
    .quick-link:first-child { margin-left: auto; }
    .quick-link:last-child { margin-right: auto; }
    .quick-link {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: .8rem;
      text-decoration: none;
      transition: color .15s;
    }
    .quick-link:hover { color: var(--text); }

    /* ======================================================================
       Instellingenmodal
       ====================================================================== */
    .settings-modal {
      width: min(1120px, 100vw - 32px);
      height: min(820px, 100dvh - 32px);
      max-width: none;
      max-height: none;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      font-size: .8125rem;
      box-shadow: 0 24px 64px rgb(0 0 0 / .3);
    }
    .settings-modal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

    .settings { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .settings-header h2 { font-size: 1rem; font-weight: 650; }

    .settings-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }

    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px;
      overflow: auto;
      border-right: 1px solid var(--border);
    }
    .settings-nav-item {
      flex: none;
      padding: 7px 12px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
    }
    .settings-nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .settings-nav-item[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .settings-panel { display: grid; align-content: start; gap: 8px; padding: 18px 28px; overflow: auto; }
    .settings-panel h3 { font-size: .95rem; font-weight: 650; }
    .settings-group {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .settings-group h4 { font-size: .85rem; font-weight: 600; }
    .settings-group p { max-width: 70ch; color: var(--text-muted); font-size: .78rem; }
    .settings-group-content { display: grid; gap: 14px; margin-top: 6px; }
    .settings-group-content > :is(.btn, .check, .inline, .office-option) { justify-self: start; }

    .field { display: grid; gap: 4px; max-width: 640px; }
    .field--wide { max-width: none; }
    .field-label { font-size: .78rem; font-weight: 600; }
    .field-hint { max-width: 70ch; color: var(--text-muted); font-size: .72rem; }
    .static-value { font-weight: 500; }

    .settings-panel :is(input[type="text"], input[type="search"], input[type="url"], input[type="password"], input[type="number"], select) {
      width: 100%;
      min-width: 0;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .settings-panel input.input-short { width: 120px; }
    .settings-panel :is(input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .settings-panel input:user-invalid { border-color: var(--danger); }
    .settings-panel input[type="range"] { width: 220px; accent-color: var(--accent); }
    .settings-panel input[type="color"] {
      width: 44px;
      height: 34px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
    }

    .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .office-option { display: grid; gap: 4px; }

    .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .inline > .field { flex: 1; min-width: 100px; }

    .swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .swatch {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px var(--border);
      cursor: pointer;
    }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }

    .image-preview {
      max-width: 160px;
      max-height: 64px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      object-fit: contain;
    }

    .icon-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 4px;
      max-width: 820px;
    }
    .icon-choice {
      display: grid;
      place-items: center;
      height: 36px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
    }
    .icon-choice .icon { width: 20px; height: 20px; }
    .icon-choice:hover { color: var(--text); border-color: var(--border); }
    .icon-choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
    .icon-choice--none { font-size: .7rem; }
    .icon-choice--wide { grid-column: span 2; }
    .icon-choice[hidden] { display: none; }
    .icon-search { max-width: 320px; margin-bottom: 6px; }
    .item-icon .icon { width: 18px; height: 18px; vertical-align: middle; }

    .status { font-size: .78rem; color: var(--text-muted); }
    .status[data-state="ok"] { color: var(--success); }
    .status[data-state="error"] { color: var(--danger); }

    .place-search { display: grid; gap: 8px; }
    .place-results { display: grid; gap: 4px; }
    .place-option {
      display: grid;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      text-align: left;
      cursor: pointer;
    }
    .place-option:hover { border-color: var(--accent); }
    .place-option span { font-size: .72rem; }

    .capacity { color: var(--text-muted); font-size: .78rem; }
    .capacity.is-over { color: var(--danger); font-weight: 600; }

    .settings-list { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
    .settings-list-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .item-icon { flex: none; width: 28px; color: var(--text-muted); font-size: .95rem; font-weight: 600; text-align: center; }
    .item-main {
      flex: 1;
      display: grid;
      min-width: 0;
      padding: 2px 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .item-title, .item-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .item-title { font-weight: 600; }
    .item-meta { color: var(--text-muted); font-size: .72rem; }

    .row-actions { display: flex; flex: none; gap: 2px; }
    .mini-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .mini-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
    .mini-btn:disabled { opacity: .3; cursor: default; }

    .rows { display: grid; gap: 6px; }
    .link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto;
      gap: 6px;
      align-items: center;
    }
    .rows + .btn { justify-self: start; margin-top: 4px; }

    .add-row { margin-top: 8px; }
    .settings-panel .add-row select { width: auto; }
    .back-btn { justify-self: start; }
    .editor-footer { margin-top: 12px; }

    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 20px;
      margin: 0;
      font-size: .9rem;
    }
    .facts dt { color: var(--text-muted); }
    .facts dd { margin: 0; }

    .settings-placeholder {
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .settings-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .settings-nav {
        flex-direction: row;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .tile--link:hover { transform: none; }
    }
  </style>
</head>

    // MIGRATIONS[n] zet een config van versie n om naar versie n + 1 (verhoog daarbij CONFIG_VERSION).
    const MIGRATIONS = {
      // v2: de standaard-emoji's uit eerdere versies worden lijniconen uit TILE_ICONS.
      1: data => {
        const emojiToIcon = {
          '✉️': 'mail', '📅': 'calendar', '🗓️': 'calendar', '💼': 'briefcase', '📰': 'rss',
          '🔗': 'link', '🗂️': 'bookmark', '📁': 'folder', '📄': 'file', '📊': 'table'
        };
        for (const tile of Array.isArray(data.tiles) ? data.tiles : []) {
          if (isPlainObject(tile) && emojiToIcon[tile.icon]) tile.icon = emojiToIcon[tile.icon];
        }
        return data;
      },
      // v3: RSS-tegels tonen standaard het favicon van de site als icoon.
      2: data => {
        for (const tile of Array.isArray(data.tiles) ? data.tiles : []) {
          if (isPlainObject(tile) && tile.type === 'rss' && ['rss', ''].includes(tile.icon ?? '')) tile.icon = 'favicon';
        }
        return data;
      }
    };

    const SETTINGS_SECTIONS = [
      { id: 'general', label: 'Algemeen', description: 'Titel, welkomsttekst en logo.' },
      { id: 'appearance', label: 'Uiterlijk', description: 'Thema, accentkleur, achtergrond, grootte van het grid en tegelstijl.' },
      { id: 'tiles', label: 'Tegels', description: 'Tegels toevoegen, bewerken, verwijderen en ordenen.' },
      { id: 'quickLinks', label: 'Snelle links', description: 'De balk met snelle links onder het grid.' },
      { id: 'weather', label: 'Weer & klok', description: 'Plaats en eenheid voor het weer, en de weergave van de klok.' },
      { id: 'services', label: 'Koppelingen', description: 'Adres en sleutel van de Cloudflare Worker voor RSS en agenda.' },
      { id: 'data', label: 'Gegevens', description: 'Exporteren, importeren en terugzetten naar de standaardinstellingen.' }
    ];

    const TIME_FORMAT = new Intl.DateTimeFormat('nl-NL', { hour: '2-digit', minute: '2-digit' });
    const TIME_FORMAT_SECONDS = new Intl.DateTimeFormat('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const DATE_FORMAT = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    const SHORT_DATE_FORMAT = new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'short' });
    const WEEKDAY_DATE_FORMAT = new Intl.DateTimeFormat('nl-NL', { weekday: 'short', day: 'numeric' });
    const FULL_DATE_TIME_FORMAT = new Intl.DateTimeFormat('nl-NL', { dateStyle: 'full', timeStyle: 'short' });
    const AGENDA_DAY_FORMAT = new Intl.DateTimeFormat('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
    const AGENDA_FULL_DAY_FORMAT = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });

    /* ======================================================================
       State
       ====================================================================== */
    let config;
    let dbPromise = null;
    let draft = null;                 // kopie van de config terwijl de instellingen open staan
    let editingTileId = null;
    let pendingSessionTileId = null;
    const sessionFiles = new Map();   // tegel-id → { file, url }, alleen voor deze sessie
    let weather = null;               // { key, fetchedAt, data, failed }
    let weatherRun = 0;               // voorkomt dat een oude weer-update een nieuwere overschrijft
    let placeSearchRun = 0;
    const feedState = new Map();      // feed-URL → { fetchedAt, feed: { title, items }, error }
    const feedRequests = new Map();   // feed-URL → lopende ophaalactie, zodat een feed niet dubbel wordt opgehaald
    const calendarState = new Map();  // agenda-URL → { fetchedAt, name, occurrences, error }
    const calendarRequests = new Map();
    const faviconRequests = new Map(); // host → Promise<object-URL | null>
    const zoneFormatters = new Map(); // tijdzone → Intl.DateTimeFormat, voor het omrekenen naar UTC
    let activeSettingsSection = SETTINGS_SECTIONS[0].id;
    const timers = {};
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    /* ======================================================================
       Opslag
       ====================================================================== */
    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // Opslag geblokkeerd of vol: de keuze geldt dan alleen voor deze sessie.
      }
    }

    // Synchroon laden uit localStorage (fast boot). status: 'stored' | 'empty' | 'corrupt'.
    function loadData() {
      const raw = storageGet(STORAGE_KEYS.config);
      if (raw) {
        try {
          const data = normalizeConfig(JSON.parse(raw));
          if (data) return { data, status: 'stored' };
        } catch {
          // Geen geldige JSON: hieronder als beschadigd behandelen.
        }
      }

      const data = normalizeConfig(DEFAULT_CONFIG);
      const theme = storageGet(STORAGE_KEYS.theme); // fase 1 bewaarde alleen het thema
      if (THEMES.includes(theme)) data.appearance.theme = theme;
      return { data, status: raw ? 'corrupt' : 'empty' };
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEYS.config, JSON.stringify(config));
      } catch (error) {
        toast(error?.name === 'QuotaExceededError'
          ? 'De opslag is vol: je instellingen zijn niet bewaard.'
          : 'Je instellingen konden niet worden bewaard.');
      }
      storageSet(STORAGE_KEYS.theme, config.appearance.theme);
      idbPut('kv', 'config', config).catch(() => {
        // Geen IndexedDB: localStorage werkt nog, alleen zonder back-up.
      });
    }

    // Na het openen van IndexedDB: back-up bijwerken, of de config herstellen als localStorage leeg of kapot was.
    async function syncBackup(status) {
      try {
        if (status === 'stored') {
          await idbPut('kv', 'config', config);
          return;
        }
        const backup = normalizeConfig(await idbGet('kv', 'config'));
        if (backup) {
          applyConfig(backup);
          toast('Je instellingen zijn hersteld uit de back-up.');
          return;
        }
      } catch {
        // IndexedDB niet beschikbaar.
      }
      if (status === 'corrupt') toast('De opgeslagen instellingen waren beschadigd; de standaardinstellingen zijn geladen.');
    }

    function applyConfig(data) {
      config = data;
      saveData();
      renderDashboard();
      startClock();
      updateWeather();
      updateFeeds();
      updateCalendars();
    }

    function initDB() {
      dbPromise ??= new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          for (const store of DB_STORES) {
            if (!request.result.objectStoreNames.contains(store)) request.result.createObjectStore(store);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return dbPromise;
    }

    async function idbRequest(storeName, mode, action) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(storeName, mode);
        const request = action(transaction.objectStore(storeName));
        transaction.oncomplete = () => resolve(request.result);
        transaction.onerror = transaction.onabort = () => reject(transaction.error);
      });
    }

    function idbGet(storeName, key) {
      return idbRequest(storeName, 'readonly', store => store.get(key));
    }

    function idbPut(storeName, key, value) {
      return idbRequest(storeName, 'readwrite', store => store.put(value, key));
    }

    // Vraagt de browser de opslag niet automatisch op te ruimen; Edge beslist zelf of dat wordt toegestaan.
    async function requestPersistentStorage() {
      try {
        if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist();
      } catch {
        // Niet ondersteund: geen probleem, alleen minder bescherming.
      }
    }

    // Maakt van willekeurige (opgeslagen of geïmporteerde) data een volledige, geldige config, of null.
    function normalizeConfig(raw) {
      if (!isPlainObject(raw)) return null;
      const data = mergeDefaults(DEFAULT_CONFIG, migrateConfig(structuredClone(raw)));

      const ids = new Set();
      const uniqueId = id => {
        const value = typeof id === 'string' && id && !ids.has(id) ? id : uid();
        ids.add(value);
        return value;
      };
      data.tiles = data.tiles.map(tile => normalizeTile(tile, uniqueId)).filter(Boolean);
      data.quickLinks.items = data.quickLinks.items
        .filter(isPlainObject)
        .map(item => ({ id: uniqueId(item.id), ...mergeDefaults(LINK_DEFAULTS, item) }));

      const { appearance } = data;
      appearance.gridColumns = clamp(Math.round(appearance.gridColumns), 2, GRID_MAX);
      appearance.gridRows = clamp(Math.round(appearance.gridRows), 2, GRID_MAX);
      if (!THEMES.includes(appearance.theme)) appearance.theme = DEFAULT_CONFIG.appearance.theme;
      if (!TILE_STYLES.includes(appearance.tileStyle)) appearance.tileStyle = DEFAULT_CONFIG.appearance.tileStyle;
      if (!isHexColor(appearance.accentColor)) appearance.accentColor = DEFAULT_CONFIG.appearance.accentColor;
      if (!isHexColor(appearance.background.color)) appearance.background.color = DEFAULT_CONFIG.appearance.background.color;
      return data;
    }

    function normalizeTile(tile, uniqueId) {
      const defaults = isPlainObject(tile) ? TILE_DEFAULTS[tile.type] : null;
      if (!defaults) return null;
      const normalized = { id: uniqueId(tile.id), type: tile.type, ...mergeDefaults(defaults, tile) };
      if (normalized.type === 'links') {
        normalized.links = normalized.links.filter(isPlainObject).map(link => mergeDefaults(LINK_DEFAULTS, link));
      }
      if (normalized.type === 'link' && !isHexColor(normalized.color)) normalized.color = '';
      if (normalized.type === 'rss') normalized.maxItems = clamp(Math.round(normalized.maxItems) || 8, 1, 30);
      if (normalized.type === 'calendar') {
        normalized.daysAhead = clamp(Math.round(normalized.daysAhead) || 30, 1, 90);
        normalized.width = clamp(Math.round(normalized.width) || 3, 2, 4);
        normalized.height = clamp(Math.round(normalized.height) || 2, 2, 4);
      }
      if (normalized.type === 'link' && !LINK_TILE_SIZES[normalized.size]) normalized.size = 'normal';
      if (!isImageDataUrl(normalized.background)) normalized.background = '';
      normalized.backgroundDim = clamp(Math.round(normalized.backgroundDim) || 80, 40, 95);
      const position = normalizePosition(tile.position);
      if (position) normalized.position = position;
      return normalized;
    }

    // Vrije plaats op het grid: kolom (1–8) en rij in halve tegels (1–16). Zonder positie volgt de tegel de lijst.
    function normalizePosition(position) {
      if (!isPlainObject(position)) return null;
      const { col, row } = position;
      if (!Number.isInteger(col) || !Number.isInteger(row) || col < 1 || col > GRID_MAX || row < 1 || row > GRID_MAX * 2) return null;
      return { col, row };
    }

    // Neemt de structuur van `defaults` over; waarden uit `value` blijven alleen staan als hun type klopt.
    function mergeDefaults(defaults, value) {
      if (Array.isArray(defaults)) return Array.isArray(value) ? value : structuredClone(defaults);
      if (isPlainObject(defaults)) {
        const source = isPlainObject(value) ? value : {};
        return Object.fromEntries(Object.entries(defaults).map(([key, fallback]) => [key, mergeDefaults(fallback, source[key])]));
      }
      return typeof value === typeof defaults ? value : defaults;
    }

    function migrateConfig(data) {
      let version = Number.isInteger(data.version) ? data.version : 1;
      while (version < CONFIG_VERSION) {
        data = MIGRATIONS[version](data);
        version += 1;
      }
      data.version = CONFIG_VERSION;
      return data;
    }

    function exportConfig() {
      const payload = { app: EXPORT_APP_ID, exportedAt: new Date().toISOString(), config };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      el('a', { href: url, download: `dashboard-instellingen-${dateStamp(new Date())}.json` }).click();
      setTimeout(() => URL.revokeObjectURL(url), 10_000);
    }

    async function importConfig(file) {
      let data = null;
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed?.app === EXPORT_APP_ID) data = normalizeConfig(parsed.config);
      } catch {
        // Geen JSON: hieronder gemeld.
      }
      if (!data) {
        toast(`"${file.name}" is geen exportbestand van dit dashboard.`);
        return;
      }
      if (!confirm(`Je huidige instellingen vervangen door die uit "${file.name}"?`)) return;
      applyConfig(data);
      closeSettings();
      toast('De instellingen zijn geïmporteerd.');
    }

    function resetConfig() {
      if (!confirm('Alle instellingen terugzetten naar de standaard? Dit kan niet ongedaan worden gemaakt.')) return;
      applyConfig(normalizeConfig(DEFAULT_CONFIG));
      closeSettings();
      toast('De standaardinstellingen zijn teruggezet.');
    }

    /* ======================================================================
       Rendering
       ====================================================================== */
    const TILE_BUILDERS = {
      link: buildLinkTile,
      links: buildLinksTile,
      rss: buildRssTile,
      calendar: buildCalendarTile
    };

    function renderDashboard() {
      applyAppearance();
      renderHeader();
      renderWeather();
      renderGrid();
      renderQuickLinks();
    }

    // Tijdens het bewerken krijgt dit de appearance uit de instellingen mee, als live voorbeeld.
    function applyAppearance(appearance = config.appearance) {
      const root = document.documentElement;
      const { type, color, image } = appearance.background;
      const background = type === 'image' && isImageDataUrl(image) ? 'image' : type === 'color' ? 'color' : 'none';
      root.style.setProperty('--accent', appearance.accentColor);
      root.style.setProperty('--page-bg', background === 'color' ? color : '');
      root.style.setProperty('--page-bg-image', background === 'image' ? `url("${image}")` : '');
      root.dataset.background = background;
      root.dataset.tileStyle = appearance.tileStyle;
      applyTheme(appearance.theme);
    }

    function resolveTheme(preference) {
      if (preference === 'light' || preference === 'dark') return preference;
      return darkQuery.matches ? 'dark' : 'light';
    }

    function applyTheme(preference = config.appearance.theme) {
      const theme = resolveTheme(preference);
      document.documentElement.dataset.theme = theme;

      const label = theme === 'dark' ? 'Schakel naar lichte modus' : 'Schakel naar donkere modus';
      const button = $('#themeToggle');
      button.setAttribute('aria-label', label);
      button.title = label;
    }

    function renderHeader() {
      const { title, logo } = config.general;
      $('#pageTitle').textContent = title;
      document.title = title;

      const logoImage = $('#logo');
      const logoSrc = resolveLogo(logo);
      logoImage.hidden = !logoSrc;
      if (logoSrc) logoImage.src = logoSrc;
      else logoImage.removeAttribute('src');

      $('#clock').hidden = !config.clock.enabled;
    }

    function resolveLogo(logo) {
      if (logo.source === 'url') return safeUrl(logo.url, IMAGE_PROTOCOLS) ?? pathToFileUrl(logo.url);
      if (logo.source === 'upload' && isImageDataUrl(logo.dataUrl)) return logo.dataUrl;
      return null;
    }

    function renderWelcome(now) {
      const { showWelcome, welcomeText } = config.general;
      const text = welcomeText.replaceAll('{dagdeel}', dayPartGreeting(now));
      const welcome = $('#welcomeText');
      welcome.textContent = text;
      welcome.hidden = !showWelcome || !text.trim();
    }

    function renderClock(now) {
      const { enabled, showSeconds, showDate } = config.clock;
      if (!enabled) return;

      const time = $('#clockTime');
      time.textContent = (showSeconds ? TIME_FORMAT_SECONDS : TIME_FORMAT).format(now);
      time.dateTime = now.toISOString();

      const date = $('#clockDate');
      date.textContent = DATE_FORMAT.format(now);
      date.hidden = !showDate;
    }

    function renderGrid() {
      const { gridColumns, gridRows } = config.appearance;
      const layout = layoutTiles(config.tiles, gridColumns);
      const usedRows = clamp(Math.ceil(layout.bottom / 2), 2, gridRows);

      const grid = $('#tileGrid');
      grid.style.setProperty('--cfg-cols', gridColumns);
      grid.dataset.cols = gridColumns;
      grid.style.setProperty('--fit-rows', usedRows);

      // In de volgorde waarin ze op het scherm staan, zodat Tab en een smal venster dezelfde volgorde volgen.
      const ordered = [...config.tiles].sort((a, b) => comparePlaces(layout.places.get(a.id), layout.places.get(b.id)));
      const tiles = ordered.map(tile => buildTile(tile, layout.places.get(tile.id))).filter(Boolean);
      if (!tiles.length) {
        tiles.push(el('p', { class: 'grid-empty' }, 'Nog geen tegels. Voeg tegels toe via ⚙ Instellingen.'));
      }
      grid.replaceChildren(...tiles);
    }

    function comparePlaces(a, b) {
      return a.row - b.row || a.col - b.col;
    }

    // Grootte van een tegel in grid-eenheden: kolommen en rijen van een halve tegel. Nooit breder dan het grid.
    // De agenda heeft een eigen, instelbare maat; een gewone tegel kan half zo hoog zijn.
    function tileSize(tile, columns) {
      const meta = TILE_TYPES[tile.type] ?? { width: 1, height: 1 };
      const width = tile.type === 'calendar' ? tile.width ?? meta.width : meta.width;
      const height = tile.type === 'calendar' ? tile.height ?? meta.height : tile.type === 'link' && tile.size === 'half' ? 0.5 : meta.height;
      return { cols: Math.min(width, columns), rows: height * 2 };
    }

    // Aantal tegelvakken (een halve tegel telt voor een half vak).
    function tileCells(tile, columns) {
      const { cols, rows } = tileSize(tile, columns);
      return cols * rows / 2;
    }

    function countCells(tiles, columns) {
      return tiles.reduce((sum, tile) => sum + tileCells(tile, columns), 0);
    }

    // Bepaalt waar elke tegel staat. Tegels met een eigen positie krijgen die (zo nodig binnen de kolommen geschoven);
    // overlapt die met een eerder geplaatste tegel, of heeft de tegel geen positie, dan komt hij op het eerste vrije
    // vak, van links naar rechts en van boven naar beneden. Rijen zijn halve tegels.
    function layoutTiles(tiles, columns) {
      const taken = new Set();
      const places = new Map();
      const fits = (col, row, size) => {
        for (let r = row; r < row + size.rows; r++) {
          for (let c = col; c < col + size.cols; c++) if (taken.has(`${r},${c}`)) return false;
        }
        return true;
      };
      const place = (tile, col, row, size) => {
        for (let r = row; r < row + size.rows; r++) for (let c = col; c < col + size.cols; c++) taken.add(`${r},${c}`);
        places.set(tile.id, { col, row, ...size });
      };

      const pending = [];
      for (const tile of tiles) {
        const size = tileSize(tile, columns);
        const col = tile.position ? clamp(tile.position.col, 1, columns - size.cols + 1) : 0;
        if (col && fits(col, tile.position.row, size)) place(tile, col, tile.position.row, size);
        else pending.push([tile, size]);
      }
      for (const [tile, size] of pending) {
        let placed = false;
        for (let row = 1; !placed; row++) {
          for (let col = 1; col <= columns - size.cols + 1 && !placed; col++) {
            if (fits(col, row, size)) {
              place(tile, col, row, size);
              placed = true;
            }
          }
        }
      }
      const bottom = Math.max(0, ...[...places.values()].map(p => p.row + p.rows - 1));
      return { places, bottom };
    }

    function buildTile(tile, place) {
      const builder = TILE_BUILDERS[tile.type];
      if (!builder) return null;
      const node = builder(tile);
      node.dataset.tileId = tile.id;
      node.draggable = true;
      node.style.setProperty('--col', place.col);
      node.style.setProperty('--row', place.row);
      node.style.setProperty('--span-cols', place.cols);
      node.style.setProperty('--span-cols-narrow', Math.min(place.cols, 2));
      node.style.setProperty('--span-rows', place.rows);
      if (tile.type === 'link' && tile.size === 'half') node.classList.add('tile--half');
      // Achtergrondafbeelding, gedimd met een overlay in de kleur van de tegel.
      if (isImageDataUrl(tile.background)) {
        node.classList.add('has-background');
        node.style.setProperty('--tile-background', `url("${tile.background}")`);
        node.style.setProperty('--tile-dim', `${tile.backgroundDim}%`);
      }
      preventInnerDrag(node);
      return node;
    }

    // Links en afbeeldingen in een tegel zijn standaard zelf sleepbaar; dan zou je een link slepen i.p.v. de tegel.
    function preventInnerDrag(root) {
      for (const element of root.querySelectorAll('a, img')) element.draggable = false;
    }

    function buildLinkTile(tile) {
      const style = tile.color ? { '--tile-color': tile.color } : null;
      const glyph = buildTileGlyph(tile);
      const face = [
        el('span', { class: glyph ? 'tile-icon' : 'tile-icon tile-icon--letter', 'aria-hidden': 'true' }, glyph ?? initial(tile.title)),
        el('span', { class: 'tile-title' }, tile.title)
      ];
      if (tile.target.kind === 'session-file') return buildSessionFileTile(tile, style, face);

      const href = resolveTarget(tile);
      if (!href) {
        return el('div', { class: 'tile tile--link is-invalid', style, title: 'Deze tegel heeft geen geldig doel' },
          el('div', { class: 'tile-main' }, face));
      }

      const isPath = tile.target.kind === 'path';
      return el('div', { class: 'tile tile--link', style },
        el('a', { class: 'tile-main', ...linkAttributes(href), title: isPath ? cleanPath(tile.target.value) : null }, face),
        isPath
          ? el('button', {
              class: 'tile-action',
              type: 'button',
              'data-action': 'copy-path',
              'data-path': cleanPath(tile.target.value),
              title: 'Pad kopiëren',
              'aria-label': `Pad van ${tile.title} kopiëren`
            }, icon('copy'))
          : null);
    }

    function resolveTarget(tile) {
      const { kind, value } = tile.target;
      if (kind === 'url') return safeUrl(value, LINK_PROTOCOLS);
      if (kind !== 'path') return null;
      const fileUrl = pathToFileUrl(value);
      return fileUrl && tile.openInApp ? officeUri(fileUrl) ?? fileUrl : fileUrl;
    }

    // Een gekozen bestand blijft alleen in deze sessie bewaard; browsers mogen het niet onthouden.
    function buildSessionFileTile(tile, style, face) {
      const chosen = sessionFiles.get(tile.id);
      if (!chosen) {
        return el('div', { class: 'tile tile--link', style },
          el('button', { class: 'tile-main', type: 'button', 'data-action': 'pick-session-file' },
            face, el('span', { class: 'tile-hint' }, 'Bestand kiezen…')));
      }
      return el('div', { class: 'tile tile--link', style },
        el('a', { class: 'tile-main', ...linkAttributes(chosen.url), title: chosen.file.name },
          face, el('span', { class: 'tile-hint' }, chosen.file.name)),
        el('button', {
          class: 'tile-action',
          type: 'button',
          'data-action': 'pick-session-file',
          title: 'Ander bestand kiezen',
          'aria-label': `Ander bestand kiezen voor ${tile.title}`
        }, icon('refresh')));
    }

    function buildLinksTile(tile) {
      const items = tile.links.map(link => {
        const href = safeUrl(link.url, LINK_PROTOCOLS);
        const label = link.label || link.url;
        return el('li', {}, href
          ? el('a', linkAttributes(href), buildFavicon(href), el('span', { class: 'link-label' }, label))
          : el('span', { class: 'is-invalid', title: 'Ongeldig adres' }, label));
      });

      return el('section', { class: 'tile tile--links', 'aria-label': tile.title },
        buildTileHeading(tile),
        el('div', { class: 'tile-body' },
          items.length ? el('ul', { class: 'tile-list' }, items) : buildTileState('Nog geen links.')));
    }

    function buildRssTile(tile) {
      return el('section', { class: 'tile tile--rss', 'aria-label': tile.title },
        buildTileHeading(tile),
        el('div', { class: 'tile-body' }, buildFeedContent(tile)));
    }

    // Inhoud van een RSS-tegel uit feedState; wordt opnieuw opgebouwd zodra een feed is opgehaald.
    function buildFeedContent(tile) {
      if (!tile.feedUrl) return buildTileState('Voeg een feed-adres toe via ⚙ Instellingen → Tegels.');
      if (!config.services.workerUrl) return buildTileState('Koppel eerst de Worker via ⚙ Instellingen → Koppelingen.');

      const state = feedState.get(tile.feedUrl);
      if (!state?.feed) {
        return state?.error
          ? buildTileState(`De feed kon niet worden geladen: ${state.error}`, true)
          : buildTileState('Laden…');
      }

      const items = state.feed.items.slice(0, tile.maxItems);
      if (!items.length) return buildTileState('Deze feed bevat geen berichten.');
      return [
        el('ul', { class: 'feed-list' }, items.map(item => {
          const href = safeUrl(item.link, ['http:', 'https:']);
          const date = item.date ? new Date(item.date) : null;
          const content = [
            date
              ? el('time', { class: 'feed-meta', datetime: date.toISOString(), title: FULL_DATE_TIME_FORMAT.format(date) }, feedDate(date))
              : el('span', { class: 'feed-meta' }),
            el('span', { class: 'feed-title' }, item.title || item.link)
          ];
          return el('li', {}, href
            ? el('a', { class: 'feed-item', ...linkAttributes(href) }, content)
            : el('span', { class: 'feed-item' }, content));
        })),
        state.error
          ? el('p', { class: 'feed-stale', title: state.error },
              `Bijwerken mislukt; dit is de stand van ${TIME_FORMAT.format(new Date(state.fetchedAt))}.`)
          : null
      ];
    }

    function renderFeedTiles(feedUrl) {
      for (const tile of config.tiles) {
        if (tile.type !== 'rss' || tile.feedUrl !== feedUrl) continue;
        const body = $(`[data-tile-id="${CSS.escape(tile.id)}"] .tile-body`);
        body?.replaceChildren(...[buildFeedContent(tile)].flat().filter(Boolean));
        if (body) preventInnerDrag(body);
        // Het favicon van de site is pas bekend als de feed geladen is.
        const heading = body?.parentElement.querySelector('.tile-heading');
        if (heading && heading.dataset.site !== feedSiteUrl(tile)) heading.replaceWith(buildTileHeading(tile));
      }
    }

    function buildCalendarTile(tile) {
      return el('section', { class: 'tile tile--calendar', 'aria-label': tile.title },
        buildTileHeading(tile),
        // tabindex: de lijst kan scrollen en moet dan ook met het toetsenbord te bereiken zijn.
        el('div', { class: 'tile-body', tabindex: 0, 'aria-label': `${tile.title}: afspraken` }, buildCalendarContent(tile)));
    }

    // Afspraken per dag, van vandaag tot daysAhead dagen vooruit.
    function buildCalendarContent(tile, now = new Date()) {
      if (!tile.icsUrl) return buildTileState('Voeg het iCal-adres van je Google Agenda toe via ⚙ Instellingen → Tegels.');
      if (!config.services.workerUrl) return buildTileState('Koppel eerst de Worker via ⚙ Instellingen → Koppelingen.');

      const state = calendarState.get(tile.icsUrl);
      if (!state?.occurrences) {
        return state?.error
          ? buildTileState(`De agenda kon niet worden geladen: ${state.error}`, true)
          : buildTileState('Laden…');
      }

      const days = groupByDay(state.occurrences, tile.daysAhead, now);
      const stale = state.error
        ? el('p', { class: 'feed-stale', title: state.error },
            `Bijwerken mislukt; dit is de stand van ${TIME_FORMAT.format(new Date(state.fetchedAt))}.`)
        : null;
      if (!days.length) return [buildTileState(`Geen afspraken in de komende ${tile.daysAhead} dagen.`), stale];

      const today = localDayNumber(now);
      return [
        el('div', { class: 'agenda' }, days.map(day => el('section', { class: 'agenda-day' },
          el('h3', { class: 'agenda-date', title: AGENDA_FULL_DAY_FORMAT.format(dayStart(day.day)) },
            day.day === today ? 'Vandaag' : day.day === today + 1 ? 'Morgen' : capitalize(AGENDA_DAY_FORMAT.format(dayStart(day.day)))),
          el('ul', { class: 'agenda-list' }, day.items.map(item => buildAgendaItem(item, day.day, now)))))),
        stale
      ];
    }

    function buildAgendaItem(item, day, now) {
      let time;
      let past = false;
      let current = false;
      if (item.allDay) {
        time = 'Hele dag';
      } else {
        const start = new Date(item.start);
        const end = new Date(item.end);
        const startsToday = localDayNumber(start) === day;
        const endsToday = localDayNumber(new Date(end - 1)) === day || end.getTime() === start.getTime();
        time = startsToday
          ? (end > start && endsToday ? `${TIME_FORMAT.format(start)}–${TIME_FORMAT.format(end)}` : TIME_FORMAT.format(start))
          : endsToday ? `tot ${TIME_FORMAT.format(end)}` : 'Hele dag';
        past = end <= now && end > start;
        current = start <= now && now < end;
      }
      return el('li', { class: `agenda-item${past ? ' is-past' : ''}${current ? ' is-now' : ''}` },
        el('span', { class: 'agenda-time' }, time),
        el('span', { class: 'agenda-text' },
          el('span', { class: 'agenda-title' }, item.title),
          item.location ? el('span', { class: 'agenda-location' }, item.location) : null));
    }

    // Verdeelt afspraken over dagen. Meerdaagse afspraken staan op elke dag; lopende afspraken van gisteren op vandaag.
    function groupByDay(occurrences, daysAhead, now) {
      const today = localDayNumber(now);
      const lastDay = today + daysAhead - 1;
      const days = new Map();
      const add = (day, item) => {
        if (day < today || day > lastDay) return;
        if (!days.has(day)) days.set(day, []);
        days.get(day).push(item);
      };

      for (const item of occurrences) {
        if (item.allDay) {
          const last = dateKeyToDayNumber(item.endDay) - 1;
          for (let day = Math.max(dateKeyToDayNumber(item.startDay), today); day <= Math.min(last, lastDay); day++) add(day, item);
        } else {
          const start = new Date(item.start);
          const end = new Date(item.end);
          const firstDay = localDayNumber(start);
          const lastItemDay = end > start ? localDayNumber(new Date(end - 1)) : firstDay;
          if (lastItemDay < today) continue;
          for (let day = Math.max(firstDay, today); day <= Math.min(lastItemDay, lastDay); day++) add(day, item);
        }
      }

      return [...days.entries()]
        .sort(([a], [b]) => a - b)
        .map(([day, items]) => ({
          day,
          items: items.sort((a, b) => (b.allDay - a.allDay) || (a.sortKey - b.sortKey) || a.title.localeCompare(b.title))
        }));
    }

    function renderCalendarTiles(icsUrl = null) {
      for (const tile of config.tiles) {
        if (tile.type !== 'calendar' || (icsUrl && tile.icsUrl !== icsUrl)) continue;
        const body = $(`[data-tile-id="${CSS.escape(tile.id)}"] .tile-body`);
        if (!body) continue;
        const scrollTop = body.scrollTop;
        body.replaceChildren(...[buildCalendarContent(tile)].flat().filter(Boolean));
        body.scrollTop = scrollTop;
      }
    }

    // De site achter een tegel: bij RSS de website van de feed, bij een gewone tegel het webadres.
    function tileSiteUrl(tile) {
      if (tile.type === 'rss') return feedSiteUrl(tile);
      if (tile.type === 'link' && tile.target.kind === 'url') return safeUrl(tile.target.value, ['http:', 'https:']);
      return null;
    }

    function feedSiteUrl(tile) {
      return safeUrl(feedState.get(tile.feedUrl)?.feed?.link, ['http:', 'https:']) ?? safeUrl(tile.feedUrl, ['http:', 'https:']);
    }

    function buildTileHeading(tile) {
      const glyph = buildTileGlyph(tile);
      return el('h2', { class: 'tile-heading', 'data-site': tile.icon === 'favicon' ? tileSiteUrl(tile) : null },
        glyph ? el('span', { 'aria-hidden': 'true' }, glyph) : null,
        el('span', {}, tile.title));
    }

    // Een lijnicoon uit TILE_ICONS, het favicon van de site, een eigen teken/emoji (in grijstinten), of niets.
    function buildTileGlyph(tile) {
      if (tile.icon === 'favicon') {
        const site = tileSiteUrl(tile);
        return (site && buildFavicon(site)) ?? icon(tile.type === 'rss' ? 'rss' : 'globe');
      }
      if (TILE_ICONS[tile.icon]) return icon(tile.icon);
      if (tile.icon) return el('span', { class: 'emoji-icon' }, tile.icon);
      return null;
    }

    function buildTileState(message, isError = false) {
      return el('p', { class: isError ? 'tile-state is-error' : 'tile-state' }, message);
    }

    // Links openen altijd in een nieuw tabblad. Office- en mailto-links starten een programma en krijgen geen (leeg) tabblad.
    function linkAttributes(href) {
      return /^(https?|file|blob):/i.test(href) ? { href, target: '_blank', rel: 'noopener noreferrer' } : { href };
    }

    // Favicon van de site, grijs tot je de link aanwijst. Lukt een bron niet, dan de volgende;
    // levert geen enkele bron iets op, dan de eerste letter van het domein.
    function buildFavicon(href) {
      if (!config.appearance.favicons) return null;
      const { protocol, hostname } = new URL(href);
      if (protocol !== 'http:' && protocol !== 'https:') return null;

      const site = { host: hostname, domain: registrableDomain(hostname) };
      const sources = FAVICON_SOURCES.map(source => source(site)).filter(Boolean);
      let index = -1;
      const image = el('img', {
        class: 'favicon',
        alt: '',
        width: 16,
        height: 16,
        referrerpolicy: 'no-referrer'
      });
      // nl.wikipedia.org → W, www.google.com → G
      const showLetter = () => image.replaceWith(
        el('span', { class: 'favicon favicon--letter', 'aria-hidden': 'true' }, initial(site.domain.split('.')[0])));
      const tryNext = () => {
        index += 1;
        if (index < sources.length) image.src = sources[index];
        else showLetter();
      };
      image.addEventListener('error', tryNext);
      // Een (bijna) leeg plaatje telt als mislukt.
      image.addEventListener('load', () => { if (image.naturalWidth < 8) tryNext(); });

      // Met een Worker zoekt die het favicon op (betrouwbaarder). Vindt de Worker niets, dan direct de letter:
      // de diensten in de browser zouden dan alleen een niet-herkenbaar standaardplaatje geven.
      // Is de Worker niet bruikbaar (bv. een oudere versie), dan de rij bronnen in de browser.
      if (config.services.workerUrl) {
        workerFavicon(site.host).then(result => {
          if (result?.url) image.src = result.url;
          else if (result?.missing) showLetter();
          else tryNext();
        });
      } else {
        tryNext();
      }
      return image;
    }

    // Favicon via de Worker, 7 dagen bewaard in IndexedDB (een site zonder favicon 1 dag).
    // Resultaat: { url } (gevonden), { missing: true } (de site heeft er geen) of null (Worker niet bruikbaar).
    function workerFavicon(host) {
      if (!faviconRequests.has(host)) {
        faviconRequests.set(host, (async () => {
          const key = `favicon2:${host}`; // 2: opnieuw ophalen na Worker 1.2.0 (betere volgorde bij doorverwijzingen)
          const cached = await idbGet('cache', key).catch(() => null);
          const maxAge = cached?.blob ? FAVICON_MAX_AGE_MS : FAVICON_MISSING_MAX_AGE_MS;
          const fromCache = () => (cached?.blob ? { url: URL.createObjectURL(cached.blob) } : null);
          if (cached && Date.now() - cached.fetchedAt < maxAge) return cached.blob ? fromCache() : { missing: true };
          try {
            const response = await fetch(`${workerEndpoint(config.services, '/favicon')}?url=${encodeURIComponent(`https://${host}`)}`, {
              headers: { 'X-Dashboard-Key': config.services.workerKey },
              signal: AbortSignal.timeout(15_000)
            });
            if (response.status === 204) {
              idbPut('cache', key, { fetchedAt: Date.now(), blob: null }).catch(() => {});
              return { missing: true };
            }
            const blob = response.ok ? await response.blob() : null;
            // Een oudere Worker zonder /favicon geeft 404: dan gewoon de bronnen in de browser gebruiken.
            if (!blob?.type.startsWith('image/')) return fromCache();
            idbPut('cache', key, { fetchedAt: Date.now(), blob }).catch(() => {});
            return { url: URL.createObjectURL(blob) };
          } catch {
            return fromCache();
          }
        })());
      }
      return faviconRequests.get(host);
    }

    // vechtdalwonen.operations.eu.dynamics.com → dynamics.com, www.bbc.co.uk → bbc.co.uk
    function registrableDomain(hostname) {
      const labels = hostname.split('.');
      const size = SECOND_LEVEL_SUFFIXES.includes(labels.slice(-2).join('.')) ? 3 : 2;
      return labels.slice(-size).join('.');
    }

    function renderQuickLinks() {
      const bar = $('#quickLinksBar');
      const links = config.quickLinks.items.flatMap(item => {
        const href = safeUrl(item.url, LINK_PROTOCOLS);
        return href
          ? [el('a', { class: 'quick-link', ...linkAttributes(href) }, buildFavicon(href), item.label || item.url)]
          : [];
      });
      bar.replaceChildren(...links);
      $('#siteFooter').hidden = !config.quickLinks.enabled || !links.length;
    }

    /* ======================================================================
       Events
       ====================================================================== */
    function bindEvents() {
      $('#themeToggle').addEventListener('click', toggleTheme);
      $('#settingsBtn').addEventListener('click', () => openSettings());
      $('#tileGrid').addEventListener('click', handleTileClick);
      bindTileDragging($('#tileGrid'));

      $('#sessionFileInput').addEventListener('change', event => {
        const [file] = event.target.files;
        event.target.value = ''; // hetzelfde bestand later opnieuw kunnen kiezen
        if (file && pendingSessionTileId) openSessionFile(pendingSessionTileId, file);
      });

      darkQuery.addEventListener('change', () => {
        applyTheme(draft?.appearance.theme ?? config.appearance.theme);
      });

      // Timers lopen achter in een verborgen tabblad; bij terugkeer de klok direct gelijkzetten.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        startClock();
        updateWeather();
        updateFeeds();
        updateCalendars();
      });

      // Wijzigingen uit een ander tabblad met het dashboard overnemen, zodat een oud tabblad ze niet overschrijft.
      window.addEventListener('storage', event => {
        if (event.key !== STORAGE_KEYS.config || !event.newValue) return;
        try {
          const data = normalizeConfig(JSON.parse(event.newValue));
          if (!data) return;
          config = data;
          renderDashboard();
          startClock();
          updateWeather();
          updateFeeds();
          updateCalendars();
        } catch {
          // Onleesbare waarde: negeren, de eigen config blijft gelden.
        }
      });

      const modal = $('#settingsModal');
      modal.addEventListener('click', event => {
        // Een klik precies op het <dialog>-element zelf is een klik op de backdrop.
        if (event.target === modal) {
          cancelSettings();
          return;
        }
        const button = event.target.closest('[data-action]');
        const action = SETTINGS_ACTIONS[button?.dataset.action];
        if (action) {
          action(button);
          return;
        }
        const navItem = event.target.closest('[data-section]');
        if (navItem) {
          editingTileId = null;
          renderSettingsSection(navItem.dataset.section);
        }
      });
      // Esc: zelf afhandelen, zodat niet-opgeslagen wijzigingen niet ongemerkt verdwijnen.
      modal.addEventListener('cancel', event => {
        event.preventDefault();
        cancelSettings();
      });

      $('#settingsPanel').addEventListener('input', handleSettingsInput);
      $('#settingsPanel').addEventListener('change', handleSettingsChange);

      $('#importFile').addEventListener('change', event => {
        const [file] = event.target.files;
        event.target.value = '';
        if (file) importConfig(file);
      });
    }

    // Tegels vrij verslepen op het dashboard. Een gestippeld vak toont waar de tegel komt; dat mag ook een leeg vak
    // zijn, los van de andere tegels. Bij loslaten krijgen alle tegels een vaste plek, zodat ze blijven staan waar ze
    // staan. Een tegel die in de weg staat, ruilt van plek met de gesleepte tegel (of schuift naar het eerste vrije
    // vak als hij daar niet past). Loslaten buiten het venster, of Esc, verandert niets.
    function bindTileDragging(grid) {
      let drag = null; // { id, offsetX, offsetY, target: { col, row } }

      grid.addEventListener('dragstart', event => {
        const tile = event.target.closest?.('[data-tile-id]');
        if (!tile || isNarrowGrid(grid)) {
          if (tile) event.preventDefault();
          return;
        }
        const rect = tile.getBoundingClientRect();
        drag = { id: tile.dataset.tileId, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top, target: null };
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', tile.querySelector('.tile-title, .tile-heading')?.textContent ?? '');
        grid.classList.add('is-sorting');
        requestAnimationFrame(() => tile.classList.add('is-dragging'));
      });

      document.addEventListener('dragover', event => {
        if (!drag) return;
        const target = dropCell(grid, drag, event.clientX, event.clientY);
        if (!target) {
          drag.target = null;
          $('.drop-ghost', grid)?.remove();
          return; // buiten het grid: loslaten doet niets
        }
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        if (drag.target?.col === target.col && drag.target?.row === target.row) return;
        drag.target = target;
        showDropGhost(grid, drag.id, target);
      });

      document.addEventListener('drop', event => {
        if (!drag) return;
        event.preventDefault();
        if (drag.target && moveTileTo(config.tiles, drag.id, drag.target, config.appearance.gridColumns)) saveData();
      });

      grid.addEventListener('dragend', () => {
        if (!drag) return;
        drag = null;
        grid.classList.remove('is-sorting');
        renderGrid();
      });
    }

    function isNarrowGrid(grid) {
      return getComputedStyle(grid).gridTemplateColumns.split(' ').length !== config.appearance.gridColumns;
    }

    // Het vak onder de linkerbovenhoek van de gesleepte tegel, afgerond naar het dichtstbijzijnde vak en binnen het grid.
    // Het grid loopt door tot het ingestelde aantal rijen, ook als de onderste rijen nog leeg zijn. Daarbuiten: null.
    function dropCell(grid, drag, x, y) {
      const tile = config.tiles.find(item => item.id === drag.id);
      const columns = config.appearance.gridColumns;
      const size = tileSize(tile, columns);
      const style = getComputedStyle(grid);
      const cell = parseFloat(style.gridTemplateColumns);
      const gap = parseFloat(style.columnGap) || 0;
      const half = (cell - gap) / 2;
      const rect = grid.getBoundingClientRect();
      const width = columns * cell + (columns - 1) * gap;
      const left = rect.left + (rect.width - width) / 2;
      const height = config.appearance.gridRows * (cell + gap);
      if (x < left - gap || x > left + width + gap || y < rect.top - gap || y > rect.top + Math.max(height, rect.height) + gap) return null;
      const col = Math.round((x - drag.offsetX - left) / (cell + gap)) + 1;
      const row = Math.round((y - drag.offsetY - rect.top) / (half + gap)) + 1;
      const maxRow = Math.max(1, config.appearance.gridRows * 2 - size.rows + 1);
      return { col: clamp(col, 1, columns - size.cols + 1), row: clamp(row, 1, maxRow) };
    }

    function showDropGhost(grid, id, target) {
      const tile = config.tiles.find(item => item.id === id);
      const size = tileSize(tile, config.appearance.gridColumns);
      let ghost = $('.drop-ghost', grid);
      if (!ghost) {
        ghost = el('div', { class: 'drop-ghost', 'aria-hidden': 'true' });
        grid.append(ghost);
      }
      ghost.style.setProperty('--col', target.col);
      ghost.style.setProperty('--row', target.row);
      ghost.style.setProperty('--span-cols', size.cols);
      ghost.style.setProperty('--span-rows', size.rows);
    }

    // Zet tegel `id` op `target`. Geeft false als er niets verandert.
    function moveTileTo(tiles, id, target, columns) {
      const before = layoutTiles(tiles, columns).places;
      const from = before.get(id);
      if (!from || (from.col === target.col && from.row === target.row)) return false;

      // Alle tegels vastzetten waar ze nu staan, daarna de gesleepte tegel verplaatsen.
      for (const tile of tiles) {
        const place = before.get(tile.id);
        tile.position = { col: place.col, row: place.row };
      }
      const moved = tiles.find(tile => tile.id === id);
      moved.position = { ...target };

      const overlaps = (a, b) => a.col < b.col + b.cols && b.col < a.col + a.cols && a.row < b.row + b.rows && b.row < a.row + a.rows;
      const area = { ...target, cols: from.cols, rows: from.rows };
      const inTheWay = tiles.filter(tile => tile.id !== id && overlaps(before.get(tile.id), area));
      const waiting = new Set(inTheWay);
      for (const tile of inTheWay) {
        // Ruilen: naar de oude plek van de gesleepte tegel, zo dicht mogelijk bij de oorspronkelijke kolom.
        waiting.delete(tile);
        const size = before.get(tile.id);
        const swap = { col: clamp(from.col, 1, columns - size.cols + 1), row: from.row, cols: size.cols, rows: size.rows };
        const others = tiles
          .filter(other => other !== tile && other.position && !waiting.has(other))
          .map(other => ({ ...other.position, cols: before.get(other.id).cols, rows: before.get(other.id).rows }));
        if (others.some(other => overlaps(other, swap))) delete tile.position;
        else tile.position = { col: swap.col, row: swap.row };
      }

      // De lijst in schermvolgorde houden: dan klopt de volgorde in Instellingen en bij Tab.
      const after = layoutTiles(tiles, columns).places;
      for (const tile of tiles) {
        const place = after.get(tile.id);
        tile.position = { col: place.col, row: place.row };
      }
      tiles.sort((a, b) => comparePlaces(after.get(a.id), after.get(b.id)));
      return true;
    }

    function handleTileClick(event) {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'copy-path') copyText(button.dataset.path);
