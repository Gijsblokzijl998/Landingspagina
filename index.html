<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%232563eb'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
  <script>
    // Thema vóór de eerste paint zetten, zodat er geen witte flits is (sleutel = STORAGE_KEYS.theme).
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('lp:theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    /* ======================================================================
       Thema (CSS custom properties)
       ====================================================================== */
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-hover: #f6f8fb;
      --border: #e1e5ed;
      --text: #141821;
      --text-muted: #5b6474;
      --accent: #2563eb;
      --accent-text: color-mix(in srgb, var(--accent) 85%, black);
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --danger: #c62828;
      --success: #2e7d32;
      --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 2px 8px rgb(16 24 40 / .06);
      --shadow-hover: 0 4px 10px rgb(16 24 40 / .08), 0 14px 28px rgb(16 24 40 / .10);
      --backdrop: rgb(15 18 25 / .45);

      --radius: 16px;
      --radius-sm: 12px;
      --gap: 16px;
      --page-pad: clamp(16px, 4vw, 40px);
      --chrome-h: 160px; /* kopbalk + voetbalk + marges: begrenst de tegelhoogte */
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0d1016;
      --surface: #161a22;
      --surface-hover: #1d222c;
      --border: #272d39;
      --text: #e7eaf0;
      --text-muted: #9aa3b2;
      --accent-text: color-mix(in srgb, var(--accent) 55%, white);
      --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent);
      --danger: #f87171;
      --success: #6fcf86;
      --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 2px 8px rgb(0 0 0 / .25);
      --shadow-hover: 0 6px 14px rgb(0 0 0 / .4), 0 16px 32px rgb(0 0 0 / .35);
      --backdrop: rgb(0 0 0 / .6);
      color-scheme: dark;
    }

    [data-tile-style="square"] {
      --radius: 4px;
      --radius-sm: 3px;
    }

    /* ======================================================================
       Basis
       ====================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--page-bg, var(--bg));
      color: var(--text);
      font: 15px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      flex: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, background-color .15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-hover); }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-background="image"] body {
      background: var(--bg) var(--page-bg-image) center / cover no-repeat fixed;
    }


    .icon {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-hover); }
    .btn--primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    .btn--danger { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger); }
    .btn--danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }

    .muted { color: var(--text-muted); }

    .toast {
      inset: auto auto 64px 50%; /* boven de voetbalk */
      max-width: min(480px, 100vw - 32px);
      margin: 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow-hover);
      font-size: .9rem;
      transform: translateX(-50%);
    }
    .toast:popover-open { animation: toast-in .2s ease-out; }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
    }

    /* ======================================================================
       Header
       ====================================================================== */
    /* Kop- en voetbalk: rustig grijs, kleine tekst, met een scheidingslijn naar de inhoud. */
    .site-header,
    .site-footer {
      position: sticky;
      z-index: 5;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(10px);
    }

    .site-header {
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas: "left center right";
      align-items: center;
      gap: 16px;
      min-height: 52px;
      padding: 8px 16px 8px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .8rem;
    }
    .header-left { grid-area: left; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-center { grid-area: center; min-width: 0; text-align: center; }
    .header-right {
      grid-area: right;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Ruimte en een lijn tussen weer/klok en de knoppen voor thema en instellingen. */
    .header-buttons {
      display: flex;
      gap: 2px;
      margin-left: 14px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .logo { display: block; max-width: 140px; max-height: 30px; object-fit: contain; }

    .page-title {
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.005em;
      line-height: 1.3;
    }
    .welcome { font-size: .85rem; white-space: nowrap; }

    .weather {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: inherit;
      line-height: 1.2;
      text-align: right;
      cursor: pointer;
    }
    .weather:hover { background: var(--surface-hover); color: var(--text); }
    .weather.is-stale { opacity: .55; }
    .weather-icon { display: grid; }
    .weather-icon .icon { width: 22px; height: 22px; }
    .weather-text { display: flex; flex-direction: column; align-items: flex-end; }
    .weather-temp { color: var(--text); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .weather-place { max-width: 140px; overflow: hidden; font-size: .72rem; white-space: nowrap; text-overflow: ellipsis; }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 0 8px;
      border-left: 1px solid var(--border);
      line-height: 1.2;
    }
    .clock-time { color: var(--text); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .clock-date { display: block; font-size: .72rem; }
    .clock-date::first-letter { text-transform: uppercase; }

    /* De themaknop toont wat je krijgt: een maan in licht thema, een zon in donker thema. */
    [data-theme="dark"] .icon-moon,
    :root:not([data-theme="dark"]) .icon-sun { display: none; }

    @media (max-width: 720px) {
      .site-header {
        grid-template-columns: auto 1fr;
        grid-template-areas: "left right" "center center";
        row-gap: 6px;
      }
      .header-center { text-align: left; }
      .header-buttons { margin-left: 4px; padding-left: 6px; }
    }

    @media (max-width: 480px) {
      .weather-place, .clock-date { display: none; }
    }

    /* ======================================================================
       Hoofdcontainer en tegelgrid
       ====================================================================== */
    #mainContainer {
      flex: 1;
      container: main / inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px var(--page-pad) 24px;
    }

    .grid {
      --cols: var(--cfg-cols, 4);
      --rows: var(--fit-rows, 4);
      /* Vierkante cellen: zo groot als de breedte en de vensterhoogte (voor de gebruikte rijen) toelaten. */
      --tile: clamp(120px, min(
        (100cqi - (var(--cols) - 1) * var(--gap)) / var(--cols),
        (100dvh - var(--chrome-h) - (var(--rows) - 1) * var(--gap)) / var(--rows)
      ), 210px);
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--tile));
      grid-auto-rows: var(--tile);
      grid-auto-flow: row dense;
      justify-content: center;
      gap: var(--gap);
      max-width: 100%;
    }

    @container main (max-width: 600px) {
      .grid {
        --cols: 2;
        --gap: 12px;
        --tile: calc((100cqi - var(--gap)) / 2);
      }
    }

    .grid-empty {
      grid-column: 1 / -1;
      align-self: center;
      text-align: center;
      color: var(--text-muted);
    }

    /* ======================================================================
       Tegels
       ====================================================================== */
    .tile {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .tile--link {
      position: relative;
      padding: 0;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .tile--link:not(.is-invalid):hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: color-mix(in srgb, var(--tile-color, var(--text-muted)) 45%, var(--border));
    }
    .tile--link.is-invalid { opacity: .55; }

    .tile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 0;
      padding: 14px;
      border: 0;
      border-radius: inherit;
      background: none;
      color: inherit;
      font: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .is-invalid .tile-main { cursor: default; }
    .tile-main:focus-visible { outline-offset: -3px; }

    .tile-hint {
      max-width: 100%;
      margin-top: -4px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: .75rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tile-action {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    .tile:hover .tile-action,
    .tile-action:focus-visible { opacity: 1; }
    .tile-action:hover { background: var(--surface-hover); color: var(--text); }
    @media (hover: none) {
      .tile-action { opacity: 1; }
    }

    .tile-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--tile-color, var(--text-muted)) 11%, transparent);
      color: var(--tile-color, var(--text-muted));
      font-size: 28px;
      line-height: 1;
    }
    .tile-icon .icon { width: 28px; height: 28px; }
    .tile-icon--letter { font-size: 24px; font-weight: 600; }
    /* Emoji's ook in grijstinten, passend bij de lijniconen. */
    .emoji-icon { filter: grayscale(1); }

    .tile-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .tile-heading {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      font-weight: 600;
    }
    .tile-heading span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tile-heading .icon { width: 15px; height: 15px; }

    .tile-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .tile-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .tile-list a,
    .tile-list .is-invalid {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      overflow: hidden;
      border-radius: 8px;
      font-size: .9rem;
      text-decoration: none;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tile-list a:hover { background: var(--accent-soft); color: var(--accent-text); }
    .link-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* Favicons staan grijs; bij aanwijzen of focus krijgen ze hun kleur. */
    .favicon {
      flex: none;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      filter: grayscale(1);
      opacity: .8;
      transition: filter .2s, opacity .2s;
    }
    a:is(:hover, :focus-visible) > .favicon { filter: none; opacity: 1; }
    /* Laatste terugval als geen enkele bron een favicon levert: de eerste letter van het domein. */
    .favicon--letter {
      display: inline-grid;
      place-items: center;
      background: var(--surface-hover);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }
    .tile-list .is-invalid { color: var(--text-muted); text-decoration: line-through; }

    .tile-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      text-align: center;
    }

    .tile-state.is-error { color: var(--danger); }

    .feed-list { display: grid; margin: 0 -6px; padding: 0; list-style: none; }
    .feed-item {
      display: grid;
      gap: 1px;
      padding: 5px 6px;
      border-radius: 8px;
      text-decoration: none;
    }
    a.feed-item:hover { background: var(--surface-hover); }
    a.feed-item:hover .feed-title { color: var(--text); }
    .feed-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      color: color-mix(in srgb, var(--text) 85%, var(--text-muted));
      font-size: .8rem;
      line-height: 1.3;
    }
    .feed-meta { color: var(--text-muted); font-size: .7rem; }
    .feed-stale { margin-top: 6px; color: var(--text-muted); font-size: .7rem; font-style: italic; }

    .tile--calendar { grid-column: span 2; grid-row: span 2; }

    /* ======================================================================
       Snelle links
       ====================================================================== */
    .site-footer {
      bottom: 0;
      border-top: 1px solid var(--border);
    }
    .quick-links {
      display: flex;
      gap: 6px;
      padding: 8px var(--page-pad);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    /* Gecentreerd als alles past, gewoon scrollbaar als het niet past. */
    .quick-link:first-child { margin-left: auto; }
    .quick-link:last-child { margin-right: auto; }
    .quick-link {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: .8rem;
      text-decoration: none;
      transition: color .15s, border-color .15s;
    }
    .quick-link:hover { border-color: color-mix(in srgb, var(--text-muted) 60%, var(--border)); color: var(--text); }

    /* ======================================================================
       Instellingenmodal
       ====================================================================== */
    .settings-modal {
      width: min(880px, 100vw - 32px);
      height: min(620px, 100dvh - 32px);
      max-width: none;
      max-height: none;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 64px rgb(0 0 0 / .3);
    }
    .settings-modal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

    .settings { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .settings-header h2 { font-size: 1.15rem; font-weight: 650; }

    .settings-body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }

    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px;
      overflow: auto;
      border-right: 1px solid var(--border);
    }
    .settings-nav-item {
      flex: none;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
    }
    .settings-nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .settings-nav-item[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .settings-panel { display: grid; align-content: start; gap: 8px; padding: 20px 24px; overflow: auto; }
    .settings-panel h3 { font-size: 1.05rem; font-weight: 650; }
    .settings-group {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .settings-group h4 { font-size: .95rem; font-weight: 600; }
    .settings-group p { max-width: 60ch; color: var(--text-muted); font-size: .9rem; }
    .settings-group-content { display: grid; gap: 14px; margin-top: 6px; }
    .settings-group-content > :is(.btn, .check, .inline, .office-option) { justify-self: start; }

    .field { display: grid; gap: 4px; max-width: 560px; }
    .field--wide { max-width: none; }
    .field-label { font-size: .85rem; font-weight: 600; }
    .field-hint { max-width: 60ch; color: var(--text-muted); font-size: .8rem; }
    .static-value { font-weight: 500; }

    .settings-panel :is(input[type="text"], input[type="search"], input[type="url"], input[type="password"], input[type="number"], select) {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .settings-panel input.input-short { width: 120px; }
    .settings-panel :is(input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .settings-panel input:user-invalid { border-color: var(--danger); }
    .settings-panel input[type="color"] {
      width: 44px;
      height: 34px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
    }

    .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .office-option { display: grid; gap: 4px; }

    .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .inline > .field { flex: 1; min-width: 100px; }

    .swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .swatch {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px var(--border);
      cursor: pointer;
    }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }

    .image-preview {
      max-width: 160px;
      max-height: 64px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      object-fit: contain;
    }

    .icon-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 4px;
      max-width: 560px;
    }
    .icon-choice {
      display: grid;
      place-items: center;
      height: 38px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
    }
    .icon-choice .icon { width: 20px; height: 20px; }
    .icon-choice:hover { color: var(--text); border-color: var(--border); }
    .icon-choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
    .icon-choice--none { font-size: .7rem; }
    .item-icon .icon { width: 18px; height: 18px; vertical-align: middle; }

    .status { font-size: .85rem; color: var(--text-muted); }
    .status[data-state="ok"] { color: var(--success); }
    .status[data-state="error"] { color: var(--danger); }

    .place-search { display: grid; gap: 8px; }
    .place-results { display: grid; gap: 4px; }
    .place-option {
      display: grid;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      text-align: left;
      cursor: pointer;
    }
    .place-option:hover { border-color: var(--accent); }
    .place-option span { font-size: .8rem; }

    .capacity { color: var(--text-muted); font-size: .9rem; }
    .capacity.is-over { color: var(--danger); font-weight: 600; }

    .settings-list { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
    .settings-list-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .item-icon { flex: none; width: 28px; color: var(--text-muted); font-size: 1.05rem; font-weight: 600; text-align: center; }
    .item-main {
      flex: 1;
      display: grid;
      min-width: 0;
      padding: 2px 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .item-title, .item-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .item-title { font-weight: 600; }
    .item-meta { color: var(--text-muted); font-size: .8rem; }

    .row-actions { display: flex; flex: none; gap: 2px; }
    .mini-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .mini-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
    .mini-btn:disabled { opacity: .3; cursor: default; }

    .rows { display: grid; gap: 6px; }
    .link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto;
      gap: 6px;
      align-items: center;
    }
    .rows + .btn { justify-self: start; margin-top: 4px; }

    .add-row { margin-top: 8px; }
    .add-row select { width: auto; }
    .back-btn { justify-self: start; }
    .editor-footer { margin-top: 12px; }

    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 20px;
      margin: 0;
      font-size: .9rem;
    }
    .facts dt { color: var(--text-muted); }
    .facts dd { margin: 0; }

    .settings-placeholder {
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .settings-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .settings-nav {
        flex-direction: row;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .tile--link:hover { transform: none; }
    }
  </style>

    // MIGRATIONS[n] zet een config van versie n om naar versie n + 1 (verhoog daarbij CONFIG_VERSION).

      // v2: de standaard-emoji's uit eerdere versies worden lijniconen uit TILE_ICONS.
      1: data => {

        for (const tile of Array.isArray(data.tiles) ? data.tiles : []) {
          if (isPlainObject(tile) && emojiToIcon[tile.icon]) tile.icon = emojiToIcon[tile.icon];
        }
        return data;
