<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%232563eb'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%2360a5fa'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%232563eb'/%3E%3C/svg%3E">
  <script>
    // Thema vóór de eerste paint zetten, zodat er geen witte flits is (sleutel = STORAGE_KEYS.theme).
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('lp:theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    /* ======================================================================
       Thema (CSS custom properties)
       ====================================================================== */
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-hover: #f6f8fb;
      --border: #e1e5ed;
      --text: #141821;
      --text-muted: #5b6474;
      --accent: #2563eb;
      --accent-text: color-mix(in srgb, var(--accent) 85%, black);
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --danger: #c62828;
      --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 2px 8px rgb(16 24 40 / .06);
      --shadow-hover: 0 4px 10px rgb(16 24 40 / .08), 0 14px 28px rgb(16 24 40 / .10);
      --backdrop: rgb(15 18 25 / .45);

      --radius: 16px;
      --radius-sm: 12px;
      --gap: 16px;
      --page-pad: clamp(16px, 4vw, 40px);
      --chrome-h: 210px; /* header + snelle links + marges: begrenst de tegelhoogte */
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0d1016;
      --surface: #161a22;
      --surface-hover: #1d222c;
      --border: #272d39;
      --text: #e7eaf0;
      --text-muted: #9aa3b2;
      --accent-text: color-mix(in srgb, var(--accent) 55%, white);
      --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent);
      --danger: #f87171;
      --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 2px 8px rgb(0 0 0 / .25);
      --shadow-hover: 0 6px 14px rgb(0 0 0 / .4), 0 16px 32px rgb(0 0 0 / .35);
      --backdrop: rgb(0 0 0 / .6);
      color-scheme: dark;
    }

    [data-tile-style="square"] {
      --radius: 4px;
      --radius-sm: 3px;
    }

    /* ======================================================================
       Basis
       ====================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--page-bg, var(--bg));
      color: var(--text);
      font: 15px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-muted);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: color .15s, background-color .15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-hover); }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-background="image"] body {
      background: var(--bg) var(--page-bg-image) center / cover no-repeat fixed;
    }
    /* Op een foto blijven titel en klok leesbaar dankzij een halfdoorzichtige ondergrond. */
    [data-background="image"] :is(.header-center, .clock) {
      padding: 6px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      backdrop-filter: blur(8px);
    }

    .icon {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-hover); }
    .btn--primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    .btn--danger { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger); }
    .btn--danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }

    .muted { color: var(--text-muted); }

    .toast {
      inset: auto auto 24px 50%;
      max-width: min(480px, 100vw - 32px);
      margin: 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow-hover);
      font-size: .9rem;
      transform: translateX(-50%);
    }
    .toast:popover-open { animation: toast-in .2s ease-out; }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
    }

    /* ======================================================================
       Header
       ====================================================================== */
    .site-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas: "left center right";
      align-items: center;
      gap: 16px;
      padding: 18px var(--page-pad) 14px;
    }
    .header-left { grid-area: left; display: flex; align-items: center; min-width: 0; }
    .header-center { grid-area: center; text-align: center; min-width: 0; }
    .header-right {
      grid-area: right;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo { display: block; max-width: 160px; max-height: 44px; object-fit: contain; }

    .page-title {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem);
      font-weight: 650;
      letter-spacing: -.01em;
      line-height: 1.2;
    }
    .welcome { margin-top: 2px; color: var(--text-muted); }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 4px;
      line-height: 1.15;
    }
    .clock-time { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .clock-date { display: block; font-size: .8rem; color: var(--text-muted); }
    .clock-date::first-letter { text-transform: uppercase; }

    /* De themaknop toont wat je krijgt: een maan in licht thema, een zon in donker thema. */
    [data-theme="dark"] .icon-moon,
    :root:not([data-theme="dark"]) .icon-sun { display: none; }

    @media (max-width: 720px) {
      .site-header {
        grid-template-columns: auto 1fr;
        grid-template-areas: "left right" "center center";
        row-gap: 12px;
      }
      .header-center { text-align: left; }
    }

    /* ======================================================================
       Hoofdcontainer en tegelgrid
       ====================================================================== */
    #mainContainer {
      flex: 1;
      container: main / inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 8px var(--page-pad) 32px;
    }

    .grid {
      --cols: var(--cfg-cols, 4);
      --rows: var(--fit-rows, 4);
      /* Vierkante cellen: zo groot als de breedte en de vensterhoogte (voor de gebruikte rijen) toelaten. */
      --tile: clamp(120px, min(
        (100cqi - (var(--cols) - 1) * var(--gap)) / var(--cols),
        (100dvh - var(--chrome-h) - (var(--rows) - 1) * var(--gap)) / var(--rows)
      ), 210px);
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--tile));
      grid-auto-rows: var(--tile);
      grid-auto-flow: row dense;
      justify-content: center;
      gap: var(--gap);
      max-width: 100%;
    }

    @container main (max-width: 600px) {
      .grid {
        --cols: 2;
        --gap: 12px;
        --tile: calc((100cqi - var(--gap)) / 2);
      }
    }

    .grid-empty {
      grid-column: 1 / -1;
      align-self: center;
      text-align: center;
      color: var(--text-muted);
    }

    /* ======================================================================
       Tegels
       ====================================================================== */
    .tile {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .tile--link {
      position: relative;
      padding: 0;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .tile--link:not(.is-invalid):hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: color-mix(in srgb, var(--tile-color, var(--accent)) 45%, var(--border));
    }
    .tile--link.is-invalid { opacity: .55; }

    .tile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 0;
      padding: 14px;
      border: 0;
      border-radius: inherit;
      background: none;
      color: inherit;
      font: inherit;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .is-invalid .tile-main { cursor: default; }
    .tile-main:focus-visible { outline-offset: -3px; }

    .tile-hint {
      max-width: 100%;
      margin-top: -4px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: .75rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tile-action {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    .tile:hover .tile-action,
    .tile-action:focus-visible { opacity: 1; }
    .tile-action:hover { background: var(--surface-hover); color: var(--text); }
    @media (hover: none) {
      .tile-action { opacity: 1; }
    }

    .tile-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--tile-color, var(--accent)) 14%, transparent);
      font-size: 30px;
      line-height: 1;
    }
    .tile-icon--letter {
      color: var(--tile-color, var(--accent-text));
      font-size: 26px;
      font-weight: 700;
    }

    .tile-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .tile-heading {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      font-weight: 600;
    }
    .tile-heading span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .tile-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .tile-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .tile-list a,
    .tile-list .is-invalid {
      display: block;
      padding: 6px 8px;
      overflow: hidden;
      border-radius: 8px;
      font-size: .9rem;
      text-decoration: none;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tile-list a:hover { background: var(--accent-soft); color: var(--accent-text); }
    .tile-list .is-invalid { color: var(--text-muted); text-decoration: line-through; }

    .tile-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      color: var(--text-muted);
      font-size: .85rem;
      text-align: center;
    }

    .tile--calendar { grid-column: span 2; grid-row: span 2; }

    /* ======================================================================
       Snelle links
       ====================================================================== */
    .quick-links {
      display: flex;
      gap: 8px;
      max-width: 100%;
      padding: 4px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    /* Gecentreerd als alles past, gewoon scrollbaar als het niet past. */
    .quick-link:first-child { margin-left: auto; }
    .quick-link:last-child { margin-right: auto; }
    .quick-link {
      flex: none;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow);
      font-size: .875rem;
      font-weight: 500;
      text-decoration: none;
      transition: color .15s, border-color .15s;
    }
    .quick-link:hover { border-color: var(--accent); color: var(--accent-text); }

    /* ======================================================================
       Instellingenmodal
       ====================================================================== */
    .settings-modal {
      width: min(880px, 100vw - 32px);
      height: min(620px, 100dvh - 32px);
      max-width: none;
      max-height: none;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 64px rgb(0 0 0 / .3);
    }
    .settings-modal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

    .settings { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    .settings-header h2 { font-size: 1.15rem; font-weight: 650; }

    .settings-body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }

    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px;
      overflow: auto;
      border-right: 1px solid var(--border);
    }
    .settings-nav-item {
      flex: none;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
    }
    .settings-nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .settings-nav-item[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
    }

    .settings-panel { display: grid; align-content: start; gap: 8px; padding: 20px 24px; overflow: auto; }
    .settings-panel h3 { font-size: 1.05rem; font-weight: 650; }
    .settings-group {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .settings-group h4 { font-size: .95rem; font-weight: 600; }
    .settings-group p { max-width: 60ch; color: var(--text-muted); font-size: .9rem; }
    .settings-group-content { display: grid; gap: 14px; margin-top: 6px; }
    .settings-group-content > :is(.btn, .check, .inline, .office-option) { justify-self: start; }

    .field { display: grid; gap: 4px; max-width: 560px; }
    .field--wide { max-width: none; }
    .field-label { font-size: .85rem; font-weight: 600; }
    .field-hint { max-width: 60ch; color: var(--text-muted); font-size: .8rem; }
    .static-value { font-weight: 500; }

    .settings-panel :is(input[type="text"], input[type="url"], input[type="password"], input[type="number"], select) {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .settings-panel input.input-short { width: 120px; }
    .settings-panel :is(input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .settings-panel input:user-invalid { border-color: var(--danger); }
    .settings-panel input[type="color"] {
      width: 44px;
      height: 34px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
    }

    .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .office-option { display: grid; gap: 4px; }

    .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .inline > .field { flex: 1; min-width: 100px; }

    .swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .swatch {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px var(--border);
      cursor: pointer;
    }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }

    .image-preview {
      max-width: 160px;
      max-height: 64px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      object-fit: contain;
    }

    .capacity { color: var(--text-muted); font-size: .9rem; }
    .capacity.is-over { color: var(--danger); font-weight: 600; }

    .settings-list { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
    .settings-list-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .item-icon { flex: none; width: 28px; color: var(--accent-text); font-size: 1.15rem; font-weight: 700; text-align: center; }
    .item-main {
      flex: 1;
      display: grid;
      min-width: 0;
      padding: 2px 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .item-title, .item-meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .item-title { font-weight: 600; }
    .item-meta { color: var(--text-muted); font-size: .8rem; }

    .row-actions { display: flex; flex: none; gap: 2px; }
    .mini-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .mini-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
    .mini-btn:disabled { opacity: .3; cursor: default; }

    .rows { display: grid; gap: 6px; }
    .link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto;
      gap: 6px;
      align-items: center;
    }
    .rows + .btn { justify-self: start; margin-top: 4px; }

    .add-row { margin-top: 8px; }
    .add-row select { width: auto; }
    .back-btn { justify-self: start; }
    .editor-footer { margin-top: 12px; }

    .facts {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 20px;
      margin: 0;
      font-size: .9rem;
    }
    .facts dt { color: var(--text-muted); }
    .facts dd { margin: 0; }

    .settings-placeholder {
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .settings-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .settings-nav {
        flex-direction: row;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .tile--link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <img id="logo" class="logo" alt="Logo" hidden>
    </div>

    <div class="header-center">
      <h1 id="pageTitle" class="page-title"></h1>
      <p id="welcomeText" class="welcome" hidden></p>
    </div>

    <div class="header-right">
      <div id="weatherWidget" class="weather" hidden></div>
      <div id="clock" class="clock">
        <time id="clockTime" class="clock-time"></time>
        <span id="clockDate" class="clock-date"></span>
      </div>
      <button id="themeToggle" class="icon-btn" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
