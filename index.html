    /* ======================================================================
       Opslag
       ====================================================================== */
    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // Opslag geblokkeerd of vol: de keuze geldt dan alleen voor deze sessie.
      }
    }

    // Synchroon laden uit localStorage (fast boot). status: 'stored' | 'empty' | 'corrupt'.
    function loadData() {
      const raw = storageGet(STORAGE_KEYS.config);
      if (raw) {
        try {
          const data = normalizeConfig(JSON.parse(raw));
          if (data) return { data, status: 'stored' };
        } catch {
          // Geen geldige JSON: hieronder als beschadigd behandelen.
        }
      }

      const data = normalizeConfig(DEFAULT_CONFIG);
      const theme = storageGet(STORAGE_KEYS.theme); // fase 1 bewaarde alleen het thema
      if (THEMES.includes(theme)) data.appearance.theme = theme;
      return { data, status: raw ? 'corrupt' : 'empty' };
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEYS.config, JSON.stringify(config));
      } catch (error) {
        toast(error?.name === 'QuotaExceededError'
          ? 'De opslag is vol: je instellingen zijn niet bewaard.'
          : 'Je instellingen konden niet worden bewaard.');
      }
      storageSet(STORAGE_KEYS.theme, config.appearance.theme);
      idbPut('kv', 'config', config).catch(() => {
        // Geen IndexedDB: localStorage werkt nog, alleen zonder back-up.
      });
    }

    // Na het openen van IndexedDB: back-up bijwerken, of de config herstellen als localStorage leeg of kapot was.
    async function syncBackup(status) {
      try {
        if (status === 'stored') {
          await idbPut('kv', 'config', config);
          return;
        }
        const backup = normalizeConfig(await idbGet('kv', 'config'));
        if (backup) {
          applyConfig(backup);
          toast('Je instellingen zijn hersteld uit de back-up.');
          return;
        }
      } catch {
        // IndexedDB niet beschikbaar.
      }
      if (status === 'corrupt') toast('De opgeslagen instellingen waren beschadigd; de standaardinstellingen zijn geladen.');
    }

    function applyConfig(data) {
      config = data;
      saveData();
      renderDashboard();
      startClock();
      updateWeather();
      updateFeeds();
    }

    function initDB() {
      dbPromise ??= new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          for (const store of DB_STORES) {
            if (!request.result.objectStoreNames.contains(store)) request.result.createObjectStore(store);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return dbPromise;
    }

    async function idbRequest(storeName, mode, action) {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(storeName, mode);
        const request = action(transaction.objectStore(storeName));
        transaction.oncomplete = () => resolve(request.result);
        transaction.onerror = transaction.onabort = () => reject(transaction.error);
      });
    }

    function idbGet(storeName, key) {
      return idbRequest(storeName, 'readonly', store => store.get(key));
    }

    function idbPut(storeName, key, value) {
      return idbRequest(storeName, 'readwrite', store => store.put(value, key));
    }

    // Vraagt de browser de opslag niet automatisch op te ruimen; Edge beslist zelf of dat wordt toegestaan.
    async function requestPersistentStorage() {
      try {
        if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist();
      } catch {
        // Niet ondersteund: geen probleem, alleen minder bescherming.
      }
    }

    // Maakt van willekeurige (opgeslagen of geïmporteerde) data een volledige, geldige config, of null.
    function normalizeConfig(raw) {
      if (!isPlainObject(raw)) return null;
      const data = mergeDefaults(DEFAULT_CONFIG, migrateConfig(structuredClone(raw)));

      const ids = new Set();
      const uniqueId = id => {
        const value = typeof id === 'string' && id && !ids.has(id) ? id : uid();
        ids.add(value);
        return value;
      };
      data.tiles = data.tiles.map(tile => normalizeTile(tile, uniqueId)).filter(Boolean);
      data.quickLinks.items = data.quickLinks.items
        .filter(isPlainObject)
        .map(item => ({ id: uniqueId(item.id), ...mergeDefaults(LINK_DEFAULTS, item) }));

      const { appearance } = data;
      appearance.gridColumns = clamp(Math.round(appearance.gridColumns), 2, 4);
      appearance.gridRows = clamp(Math.round(appearance.gridRows), 2, 4);
      if (!THEMES.includes(appearance.theme)) appearance.theme = DEFAULT_CONFIG.appearance.theme;
      if (!TILE_STYLES.includes(appearance.tileStyle)) appearance.tileStyle = DEFAULT_CONFIG.appearance.tileStyle;
      if (!isHexColor(appearance.accentColor)) appearance.accentColor = DEFAULT_CONFIG.appearance.accentColor;
      if (!isHexColor(appearance.background.color)) appearance.background.color = DEFAULT_CONFIG.appearance.background.color;
      return data;
    }

    function normalizeTile(tile, uniqueId) {
      const defaults = isPlainObject(tile) ? TILE_DEFAULTS[tile.type] : null;
      if (!defaults) return null;
      const normalized = { id: uniqueId(tile.id), type: tile.type, ...mergeDefaults(defaults, tile) };
      if (normalized.type === 'links') {
        normalized.links = normalized.links.filter(isPlainObject).map(link => mergeDefaults(LINK_DEFAULTS, link));
      }
      if (normalized.type === 'link' && !isHexColor(normalized.color)) normalized.color = '';
      if (normalized.type === 'rss') normalized.maxItems = clamp(Math.round(normalized.maxItems) || 8, 1, 30);
      if (normalized.type === 'calendar') normalized.daysAhead = clamp(Math.round(normalized.daysAhead) || 30, 1, 90);
      return normalized;
    }

    // Neemt de structuur van `defaults` over; waarden uit `value` blijven alleen staan als hun type klopt.
    function mergeDefaults(defaults, value) {
      if (Array.isArray(defaults)) return Array.isArray(value) ? value : structuredClone(defaults);
      if (isPlainObject(defaults)) {
        const source = isPlainObject(value) ? value : {};
        return Object.fromEntries(Object.entries(defaults).map(([key, fallback]) => [key, mergeDefaults(fallback, source[key])]));
      }
      return typeof value === typeof defaults ? value : defaults;
    }

    function migrateConfig(data) {
      let version = Number.isInteger(data.version) ? data.version : 1;
      while (version < CONFIG_VERSION) {
        data = MIGRATIONS[version](data);
        version += 1;
      }
      data.version = CONFIG_VERSION;
      return data;
    }

    function exportConfig() {
      const payload = { app: EXPORT_APP_ID, exportedAt: new Date().toISOString(), config };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      el('a', { href: url, download: `dashboard-instellingen-${dateStamp(new Date())}.json` }).click();
      setTimeout(() => URL.revokeObjectURL(url), 10_000);
    }

    async function importConfig(file) {
      let data = null;
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed?.app === EXPORT_APP_ID) data = normalizeConfig(parsed.config);
      } catch {
        // Geen JSON: hieronder gemeld.
      }
      if (!data) {
        toast(`"${file.name}" is geen exportbestand van dit dashboard.`);
        return;
      }
      if (!confirm(`Je huidige instellingen vervangen door die uit "${file.name}"?`)) return;
      applyConfig(data);
      closeSettings();
      toast('De instellingen zijn geïmporteerd.');
    }

    function resetConfig() {
      if (!confirm('Alle instellingen terugzetten naar de standaard? Dit kan niet ongedaan worden gemaakt.')) return;
      applyConfig(normalizeConfig(DEFAULT_CONFIG));
      closeSettings();
      toast('De standaardinstellingen zijn teruggezet.');
    }

    /* ======================================================================
       Rendering
       ====================================================================== */
    const TILE_BUILDERS = {
      link: buildLinkTile,
      links: buildLinksTile,
      rss: buildRssTile,
      calendar: buildCalendarTile
    };

    function renderDashboard() {
      applyAppearance();
      renderHeader();
      renderWeather();
      renderGrid();
      renderQuickLinks();
    }

    // Tijdens het bewerken krijgt dit de appearance uit de instellingen mee, als live voorbeeld.
    function applyAppearance(appearance = config.appearance) {
      const root = document.documentElement;
      const { type, color, image } = appearance.background;
      const background = type === 'image' && isImageDataUrl(image) ? 'image' : type === 'color' ? 'color' : 'none';
      root.style.setProperty('--accent', appearance.accentColor);
      root.style.setProperty('--page-bg', background === 'color' ? color : '');
      root.style.setProperty('--page-bg-image', background === 'image' ? `url("${image}")` : '');
      root.dataset.background = background;
      root.dataset.tileStyle = appearance.tileStyle;
      applyTheme(appearance.theme);
    }

    function resolveTheme(preference) {
      if (preference === 'light' || preference === 'dark') return preference;
      return darkQuery.matches ? 'dark' : 'light';
    }

    function applyTheme(preference = config.appearance.theme) {
      const theme = resolveTheme(preference);
      document.documentElement.dataset.theme = theme;

      const label = theme === 'dark' ? 'Schakel naar lichte modus' : 'Schakel naar donkere modus';
      const button = $('#themeToggle');
      button.setAttribute('aria-label', label);
      button.title = label;
    }

    function renderHeader() {
      const { title, logo } = config.general;
      $('#pageTitle').textContent = title;
      document.title = title;

      const logoImage = $('#logo');
      const logoSrc = resolveLogo(logo);
      logoImage.hidden = !logoSrc;
      if (logoSrc) logoImage.src = logoSrc;
      else logoImage.removeAttribute('src');

      $('#clock').hidden = !config.clock.enabled;
    }

    function resolveLogo(logo) {
      if (logo.source === 'url') return safeUrl(logo.url, IMAGE_PROTOCOLS) ?? pathToFileUrl(logo.url);
      if (logo.source === 'upload' && isImageDataUrl(logo.dataUrl)) return logo.dataUrl;
      return null;
    }

    function renderWelcome(now) {
      const { showWelcome, welcomeText } = config.general;
      const text = welcomeText.replaceAll('{dagdeel}', dayPartGreeting(now));
      const welcome = $('#welcomeText');
      welcome.textContent = text;
      welcome.hidden = !showWelcome || !text.trim();
    }

    function renderClock(now) {
      const { enabled, showSeconds, showDate } = config.clock;
      if (!enabled) return;

      const time = $('#clockTime');
      time.textContent = (showSeconds ? TIME_FORMAT_SECONDS : TIME_FORMAT).format(now);
      time.dateTime = now.toISOString();

      const date = $('#clockDate');
      date.textContent = DATE_FORMAT.format(now);
      date.hidden = !showDate;
    }

    function renderGrid() {
      const { gridColumns, gridRows } = config.appearance;
      const usedRows = Math.min(gridRows, Math.max(2, Math.ceil(countCells(config.tiles) / gridColumns)));

      const grid = $('#tileGrid');
      grid.style.setProperty('--cfg-cols', gridColumns);
      grid.style.setProperty('--fit-rows', usedRows);

      const tiles = config.tiles.map(buildTile).filter(Boolean);
      if (!tiles.length) {
        tiles.push(el('p', { class: 'grid-empty' }, 'Nog geen tegels. Voeg tegels toe via ⚙ Instellingen.'));
      }
      grid.replaceChildren(...tiles);
    }

    function countCells(tiles) {
      return tiles.reduce((sum, tile) => sum + (TILE_TYPES[tile.type]?.cells ?? 1), 0);
    }

    function buildTile(tile) {
      const builder = TILE_BUILDERS[tile.type];
      if (!builder) return null;
      const node = builder(tile);
      node.dataset.tileId = tile.id;
      return node;
    }

    function buildLinkTile(tile) {
      const style = tile.color ? { '--tile-color': tile.color } : null;
      const glyph = buildTileGlyph(tile);
      const face = [
        el('span', { class: glyph ? 'tile-icon' : 'tile-icon tile-icon--letter', 'aria-hidden': 'true' }, glyph ?? initial(tile.title)),
        el('span', { class: 'tile-title' }, tile.title)
      ];
      if (tile.target.kind === 'session-file') return buildSessionFileTile(tile, style, face);

      const href = resolveTarget(tile);
      if (!href) {
        return el('div', { class: 'tile tile--link is-invalid', style, title: 'Deze tegel heeft geen geldig doel' },
          el('div', { class: 'tile-main' }, face));
      }

      const isPath = tile.target.kind === 'path';
      return el('div', { class: 'tile tile--link', style },
        el('a', { class: 'tile-main', ...linkAttributes(href), title: isPath ? cleanPath(tile.target.value) : null }, face),
        isPath
          ? el('button', {
              class: 'tile-action',
              type: 'button',
              'data-action': 'copy-path',
              'data-path': cleanPath(tile.target.value),
              title: 'Pad kopiëren',
              'aria-label': `Pad van ${tile.title} kopiëren`
            }, icon('copy'))
          : null);
    }

    function resolveTarget(tile) {
      const { kind, value } = tile.target;
      if (kind === 'url') return safeUrl(value, LINK_PROTOCOLS);
      if (kind !== 'path') return null;
      const fileUrl = pathToFileUrl(value);
      return fileUrl && tile.openInApp ? officeUri(fileUrl) ?? fileUrl : fileUrl;
    }

    // Een gekozen bestand blijft alleen in deze sessie bewaard; browsers mogen het niet onthouden.
    function buildSessionFileTile(tile, style, face) {
      const chosen = sessionFiles.get(tile.id);
      if (!chosen) {
        return el('div', { class: 'tile tile--link', style },
          el('button', { class: 'tile-main', type: 'button', 'data-action': 'pick-session-file' },
            face, el('span', { class: 'tile-hint' }, 'Bestand kiezen…')));
      }
      return el('div', { class: 'tile tile--link', style },
        el('a', { class: 'tile-main', ...linkAttributes(chosen.url), title: chosen.file.name },
          face, el('span', { class: 'tile-hint' }, chosen.file.name)),
        el('button', {
          class: 'tile-action',
          type: 'button',
          'data-action': 'pick-session-file',
          title: 'Ander bestand kiezen',
          'aria-label': `Ander bestand kiezen voor ${tile.title}`
        }, icon('refresh')));
    }

    function buildLinksTile(tile) {
      const items = tile.links.map(link => {
        const href = safeUrl(link.url, LINK_PROTOCOLS);
        const label = link.label || link.url;
        return el('li', {}, href
          ? el('a', linkAttributes(href), buildFavicon(href), el('span', { class: 'link-label' }, label))
          : el('span', { class: 'is-invalid', title: 'Ongeldig adres' }, label));
      });

      return el('section', { class: 'tile tile--links', 'aria-label': tile.title },
        buildTileHeading(tile),
        el('div', { class: 'tile-body' },
          items.length ? el('ul', { class: 'tile-list' }, items) : buildTileState('Nog geen links.')));
    }

    function buildRssTile(tile) {
      return el('section', { class: 'tile tile--rss', 'aria-label': tile.title },
        buildTileHeading(tile),
        el('div', { class: 'tile-body' }, buildFeedContent(tile)));
    }

    // Inhoud van een RSS-tegel uit feedState; wordt opnieuw opgebouwd zodra een feed is opgehaald.
    function buildFeedContent(tile) {
      if (!tile.feedUrl) return buildTileState('Voeg een feed-adres toe via ⚙ Instellingen → Tegels.');
      if (!config.services.workerUrl) return buildTileState('Koppel eerst de Worker via ⚙ Instellingen → Koppelingen.');

      const state = feedState.get(tile.feedUrl);
      if (!state?.feed) {
        return state?.error
          ? buildTileState(`De feed kon niet worden geladen: ${state.error}`, true)
          : buildTileState('Laden…');
      }

      const items = state.feed.items.slice(0, tile.maxItems);
      if (!items.length) return buildTileState('Deze feed bevat geen berichten.');
      return [
        el('ul', { class: 'feed-list' }, items.map(item => {
          const href = safeUrl(item.link, ['http:', 'https:']);
          const date = item.date ? new Date(item.date) : null;
          const content = [
            el('span', { class: 'feed-title' }, item.title || item.link),
            date ? el('time', { class: 'feed-meta', datetime: date.toISOString(), title: FULL_DATE_TIME_FORMAT.format(date) }, relativeTime(date)) : null
          ];
          return el('li', {}, href
            ? el('a', { class: 'feed-item', ...linkAttributes(href) }, content)
            : el('span', { class: 'feed-item' }, content));
        })),
        state.error
          ? el('p', { class: 'feed-stale', title: state.error },
              `Bijwerken mislukt; dit is de stand van ${TIME_FORMAT.format(new Date(state.fetchedAt))}.`)
          : null
      ];
    }

    function renderFeedTiles(feedUrl) {
      for (const tile of config.tiles) {
        if (tile.type !== 'rss' || tile.feedUrl !== feedUrl) continue;
        $(`[data-tile-id="${CSS.escape(tile.id)}"] .tile-body`)?.replaceChildren(...[buildFeedContent(tile)].flat());
      }
    }

    function buildCalendarTile(tile) {
      return el('section', { class: 'tile tile--calendar', 'aria-label': tile.title },
        buildTileHeading(tile),
        el('div', { class: 'tile-body' }, buildTileState(dataTileMessage(tile))));
    }

    function dataTileMessage(tile) {
      if (!tile.icsUrl) return 'Voeg het iCal-adres van je Google Agenda toe via ⚙ Instellingen → Tegels.';
      if (!config.services.workerUrl) return 'Koppel eerst de Worker via ⚙ Instellingen → Koppelingen.';
      return 'De agenda wordt vanaf fase 8 opgehaald.';
    }

    function buildTileHeading(tile) {
      const glyph = buildTileGlyph(tile);
      return el('h2', { class: 'tile-heading' },
        glyph ? el('span', { 'aria-hidden': 'true' }, glyph) : null,
        el('span', {}, tile.title));
    }

    // Een lijnicoon uit TILE_ICONS, of een eigen teken/emoji (in grijstinten), of niets.
    function buildTileGlyph(tile) {
      if (TILE_ICONS[tile.icon]) return icon(tile.icon);
      if (tile.icon) return el('span', { class: 'emoji-icon' }, tile.icon);
      return null;
    }

    function buildTileState(message, isError = false) {
      return el('p', { class: isError ? 'tile-state is-error' : 'tile-state' }, message);
    }

    // Links openen altijd in een nieuw tabblad. Office- en mailto-links starten een programma en krijgen geen (leeg) tabblad.
    function linkAttributes(href) {
      return /^(https?|file|blob):/i.test(href) ? { href, target: '_blank', rel: 'noopener noreferrer' } : { href };
    }

    // Favicon van de site, grijs tot je de link aanwijst. Lukt een bron niet, dan de volgende;
    // levert geen enkele bron iets op, dan de eerste letter van het domein.
    function buildFavicon(href) {
      if (!config.appearance.favicons) return null;
      const { protocol, hostname } = new URL(href);
      if (protocol !== 'http:' && protocol !== 'https:') return null;

      let source = 0;
      const image = el('img', {
        class: 'favicon',
        src: FAVICON_SOURCES[0](hostname),
        alt: '',
        width: 16,
        height: 16,
        referrerpolicy: 'no-referrer'
      });
      const tryNext = () => {
        source += 1;
        if (source < FAVICON_SOURCES.length) {
          image.src = FAVICON_SOURCES[source](hostname);
        } else {
          // nl.wikipedia.org → W, www.google.com → G
          const labels = hostname.split('.');
          const name = labels.length > 2 ? labels[labels.length - 2] : labels[0];
          image.replaceWith(el('span', { class: 'favicon favicon--letter', 'aria-hidden': 'true' }, initial(name)));
        }
      };
      image.addEventListener('error', tryNext);
      // Een (bijna) leeg plaatje telt als mislukt.
      image.addEventListener('load', () => { if (image.naturalWidth < 8) tryNext(); });
      return image;
    }

    function renderQuickLinks() {
      const bar = $('#quickLinksBar');
      const links = config.quickLinks.items.flatMap(item => {
        const href = safeUrl(item.url, LINK_PROTOCOLS);
        return href
          ? [el('a', { class: 'quick-link', ...linkAttributes(href) }, buildFavicon(href), item.label || item.url)]
          : [];
      });
      bar.replaceChildren(...links);
      $('#siteFooter').hidden = !config.quickLinks.enabled || !links.length;
    }

    /* ======================================================================
       Events
       ====================================================================== */
    function bindEvents() {
      $('#themeToggle').addEventListener('click', toggleTheme);
      $('#settingsBtn').addEventListener('click', () => openSettings());
      $('#tileGrid').addEventListener('click', handleTileClick);
      $('#weatherWidget').addEventListener('click', () => openSettings('weather'));

      $('#sessionFileInput').addEventListener('change', event => {
        const [file] = event.target.files;
        event.target.value = ''; // hetzelfde bestand later opnieuw kunnen kiezen
        if (file && pendingSessionTileId) openSessionFile(pendingSessionTileId, file);
      });

      darkQuery.addEventListener('change', () => {
        applyTheme(draft?.appearance.theme ?? config.appearance.theme);
      });

      // Timers lopen achter in een verborgen tabblad; bij terugkeer de klok direct gelijkzetten.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        startClock();
        updateWeather();
        updateFeeds();
      });

      // Wijzigingen uit een ander tabblad met het dashboard overnemen, zodat een oud tabblad ze niet overschrijft.
      window.addEventListener('storage', event => {
        if (event.key !== STORAGE_KEYS.config || !event.newValue) return;
        try {
          const data = normalizeConfig(JSON.parse(event.newValue));
          if (!data) return;
          config = data;
          renderDashboard();
          startClock();
          updateWeather();
          updateFeeds();
        } catch {
          // Onleesbare waarde: negeren, de eigen config blijft gelden.
        }
      });

      const modal = $('#settingsModal');
      modal.addEventListener('click', event => {
        // Een klik precies op het <dialog>-element zelf is een klik op de backdrop.
        if (event.target === modal) {
          cancelSettings();
          return;
        }
        const button = event.target.closest('[data-action]');
        const action = SETTINGS_ACTIONS[button?.dataset.action];
        if (action) {
          action(button);
          return;
        }
        const navItem = event.target.closest('[data-section]');
        if (navItem) {
          editingTileId = null;
          renderSettingsSection(navItem.dataset.section);
        }
      });
      // Esc: zelf afhandelen, zodat niet-opgeslagen wijzigingen niet ongemerkt verdwijnen.
      modal.addEventListener('cancel', event => {
        event.preventDefault();
        cancelSettings();
      });

      $('#settingsPanel').addEventListener('input', handleSettingsInput);
      $('#settingsPanel').addEventListener('change', handleSettingsChange);

      $('#importFile').addEventListener('change', event => {
        const [file] = event.target.files;
        event.target.value = '';
        if (file) importConfig(file);
      });
    }

    function handleTileClick(event) {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'copy-path') copyText(button.dataset.path);
      if (button.dataset.action === 'pick-session-file') {
        pendingSessionTileId = button.closest('[data-tile-id]').dataset.tileId;
        $('#sessionFileInput').click();
      }
    }

    function openSessionFile(tileId, file) {
      const previous = sessionFiles.get(tileId);
      if (previous) URL.revokeObjectURL(previous.url);
      const url = URL.createObjectURL(file);
      sessionFiles.set(tileId, { file, url });
      renderGrid();
      if (!window.open(url, '_blank')) toast(`"${file.name}" is gekozen. Klik op de tegel om het te openen.`);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast('Pad gekopieerd. Plak het in Verkenner met Ctrl+V.');
      } catch {
        toast(`Kopiëren lukte niet. Het pad is: ${text}`);
      }
    }

    function toggleTheme() {
      config.appearance.theme = resolveTheme(config.appearance.theme) === 'dark' ? 'light' : 'dark';
      saveData();
      applyTheme();
    }

    function startClock() {
      clearTimeout(timers.clock);
      const tick = () => {
        const now = new Date();
        renderClock(now);
        renderWelcome(now);
        const interval = config.clock.showSeconds ? 1000 : 60_000;
        timers.clock = setTimeout(tick, interval - (now.getTime() % interval) + 20);
      };
      tick();
    }

    /* ======================================================================
       Databronnen
       ====================================================================== */
    // Adres van een Worker-route; werkt ook als het Worker-adres op een / eindigt.
    function workerEndpoint(services, path) {
      return `${services.workerUrl.trim().replace(/\/+$/, '')}${path}`;
    }

    function weatherKey(settings = config.weather) {
      const { latitude, longitude } = settings.location;
      return `${latitude},${longitude},${settings.unit}`;
    }

    // Toont het weer uit de cache en haalt het opnieuw op als het ouder is dan 30 minuten.
    async function updateWeather({ force = false } = {}) {
      const run = ++weatherRun;
      clearTimeout(timers.weather);
      if (!config.weather.enabled) {
        renderWeather();
        return;
      }

      const key = weatherKey();
      if (weather?.key !== key) {
        const cached = await idbGet('cache', 'weather').catch(() => null);
        if (run !== weatherRun) return;
        weather = cached?.key === key ? cached : null;
        renderWeather();
      }

      const age = () => (weather ? Date.now() - weather.fetchedAt : Infinity);
      if (force || weather?.failed || age() >= WEATHER_REFRESH_MS) {
        const result = await fetchWeather(key);
        if (run !== weatherRun) return;
        if (result) {
          weather = result;
          idbPut('cache', 'weather', result).catch(() => {});
        } else if (weather) {
          weather.failed = true; // laatste waarde blijft staan, gemarkeerd als verouderd
        }
        renderWeather();
      }
      // Na een mislukte poging over een minuut opnieuw, anders als de data 30 minuten oud is.
      timers.weather = setTimeout(updateWeather, weather?.failed ? 60_000 : Math.max(60_000, WEATHER_REFRESH_MS - age()));
    }

    async function fetchWeather(key) {
      const { location, unit } = config.weather;
      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: 'temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day',
        daily: 'temperature_2m_max,temperature_2m_min',
        timezone: 'auto',
        forecast_days: 1
      });
      if (unit === 'fahrenheit') params.set('temperature_unit', 'fahrenheit');
      try {
        const response = await fetch(`${WEATHER_API}?${params}`, { signal: AbortSignal.timeout(10_000) });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (typeof data?.current?.temperature_2m !== 'number') throw new Error('Onverwacht antwoord');
        return { key, fetchedAt: Date.now(), data, failed: false };
      } catch {
        return null;
      }
    }

    function renderWeather() {
      const widget = $('#weatherWidget');
      const current = config.weather.enabled && weather?.key === weatherKey() ? weather.data.current : null;
      widget.hidden = !current;
      if (!current) return;

      const [dayIcon, nightIcon, description] = WMO_CODES[current.weather_code] ?? ['cloud', 'cloud', 'Onbekend weer'];
      const { name } = config.weather.location;
      const { temperature_2m_min: min, temperature_2m_max: max } = weather.data.daily ?? {};
      const stale = weather.failed || Date.now() - weather.fetchedAt > 2 * WEATHER_REFRESH_MS;
      const temperature = `${Math.round(current.temperature_2m)}°`;

      $('.weather-icon', widget).replaceChildren(icon(current.is_day ? dayIcon : nightIcon));
      $('.weather-temp', widget).textContent = temperature;
      $('.weather-place', widget).textContent = name;
      widget.classList.toggle('is-stale', stale);
      widget.title = [
        `${description} in ${name}`,
        `Gevoelstemperatuur ${Math.round(current.apparent_temperature)}°`,
        min?.length && max?.length ? `Vandaag ${Math.round(min[0])}° tot ${Math.round(max[0])}°` : null,
        `Wind ${Math.round(current.wind_speed_10m)} km/u`,
        `Bijgewerkt om ${TIME_FORMAT.format(new Date(weather.fetchedAt))}${stale ? ' (verouderd)' : ''}`
      ].filter(Boolean).join('\n');
      widget.setAttribute('aria-label', `Weer in ${name}: ${temperature}, ${description.toLowerCase()}. Plaats wijzigen`);
    }

    // Haalt een bestand op via de Worker; gooit een fout met de (Nederlandse) uitleg van de Worker.
    async function proxyFetch(route, url) {
      const response = await fetch(`${workerEndpoint(config.services, route)}?url=${encodeURIComponent(url)}`, {
        headers: { 'X-Dashboard-Key': config.services.workerKey },
        signal: AbortSignal.timeout(20_000)
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error ?? `de Worker gaf status ${response.status}.`);
      }
      return response.text();
    }

    // Ververst alle RSS-tegels: eerst de cache tonen, dan ophalen als de data ouder is dan 15 minuten.
    async function updateFeeds({ force = false } = {}) {
      clearTimeout(timers.rss);
      const urls = [...new Set(config.tiles.filter(tile => tile.type === 'rss' && tile.feedUrl).map(tile => tile.feedUrl))];
      await Promise.all(urls.map(url => updateFeed(url, force)));
      const failed = urls.some(url => feedState.get(url)?.error);
      timers.rss = setTimeout(updateFeeds, failed ? 2 * 60_000 : RSS_REFRESH_MS);
    }

    function updateFeed(url, force) {
      if (!feedRequests.has(url)) {
        feedRequests.set(url, refreshFeed(url, force).finally(() => feedRequests.delete(url)));
      }
      return feedRequests.get(url);
    }

    async function refreshFeed(url, force) {
      if (!feedState.has(url)) {
        const cached = await idbGet('cache', `rss:${url}`).catch(() => null);
        if (cached?.feed) {
          feedState.set(url, { ...cached, error: null });
          renderFeedTiles(url);
        }
      }
      const state = feedState.get(url);
      if (!config.services.workerUrl) return;
      if (!force && state?.feed && !state.error && Date.now() - state.fetchedAt < RSS_REFRESH_MS) return;

      try {
        const feed = parseFeed(await proxyFetch('/rss', url), url);
        const next = { fetchedAt: Date.now(), feed: { ...feed, items: feed.items.slice(0, RSS_CACHE_ITEMS) }, error: null };
        feedState.set(url, next);
        idbPut('cache', `rss:${url}`, { fetchedAt: next.fetchedAt, feed: next.feed }).catch(() => {});
      } catch (error) {
        // Bij een fout blijft de laatst bekende inhoud staan, met een melding.
        feedState.set(url, { fetchedAt: state?.fetchedAt ?? 0, feed: state?.feed ?? null, error: error.message || 'onbekende fout.' });
      }
      renderFeedTiles(url);
    }

    // Leest RSS 2.0, RSS 1.0 (RDF) en Atom. Alleen titel, link en datum worden gebruikt; nooit HTML uit de feed.
    function parseFeed(xml, baseUrl) {
      if (/^\s*(<!doctype html|<html)/i.test(xml)) {
        throw new Error('dit adres geeft een webpagina, geen RSS- of Atom-feed. Zoek op de site naar de link van de feed.');
      }
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('dit is geen geldige RSS- of Atom-feed.');
      const root = doc.documentElement;
      const isAtom = root.localName === 'feed';
      if (!isAtom && root.localName !== 'rss' && root.localName !== 'RDF') {
        throw new Error('dit is geen RSS- of Atom-feed.');
      }

      const child = (node, name) => [...node.children].find(element => element.localName === name);
      const text = (node, ...names) => {
        for (const name of names) {
          const value = [...node.children].find(element => element.localName === name && element.textContent.trim())?.textContent.trim();
          if (value) return value;
        }
        return '';
      };
      const channel = isAtom ? root : child(root, 'channel') ?? root;
      const entries = [...root.getElementsByTagNameNS('*', isAtom ? 'entry' : 'item')];

      return {
        title: htmlToText(text(channel, 'title')),
        items: entries.map(entry => {
          let link = '';
          if (isAtom) {
            const links = [...entry.children].filter(element => element.localName === 'link');
            const alternate = links.find(element => (element.getAttribute('rel') ?? 'alternate') === 'alternate') ?? links[0];
            link = alternate?.getAttribute('href') ?? '';
          } else {
            link = text(entry, 'link');
            const guid = child(entry, 'guid');
            if (!link && guid && guid.getAttribute('isPermaLink') !== 'false') link = guid.textContent.trim();
          }
          const dateText = text(entry, 'pubDate', 'published', 'updated', 'date');
          const time = Date.parse(dateText);
          return {
            title: htmlToText(text(entry, 'title')),
            link: link ? resolveUrl(link, baseUrl) : '',
            date: Number.isNaN(time) ? null : new Date(time).toISOString()
          };
        }).filter(item => item.title || item.link)
      };
    }

    // Titels kunnen HTML of entiteiten bevatten (Atom type="html"); DOMParser voert daarbij niets uit.
    function htmlToText(value) {
      if (!/[<&]/.test(value)) return value;
      return new DOMParser().parseFromString(value, 'text/html').body.textContent.trim();
    }

    function resolveUrl(value, baseUrl) {
      try {
        return new URL(value, baseUrl).href;
      } catch {
        return '';
      }
    }

    async function geocode(query) {
      const params = new URLSearchParams({ name: query.trim(), count: 8, language: 'nl', format: 'json' });
      const response = await fetch(`${GEOCODING_API}?${params}`, { signal: AbortSignal.timeout(10_000) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { results = [] } = await response.json();
      // Alleen woonplaatsen en gebieden (geen vliegvelden, bergen enz.), tenzij er verder niets is.
      const places = results.filter(place => /^(PPL|ADM)/.test(place.feature_code ?? ''));
      return (places.length ? places : results).slice(0, 6);
    }

    const searchPlaces = debounce(async query => {
      const run = ++placeSearchRun;
      const results = $('#placeResults');
      if (!results) return;
      if (query.trim().length < 2) {
        results.replaceChildren();
        return;
      }
      results.replaceChildren(el('p', { class: 'field-hint' }, 'Zoeken…'));
      let content;
      try {
        const places = await geocode(query);
        content = places.length
          ? places.map(place => el('button', {
              class: 'place-option',
              type: 'button',
              'data-action': 'choose-place',
              'data-name': place.name,
              'data-latitude': place.latitude,
              'data-longitude': place.longitude
            },
              el('strong', {}, place.name),
              el('span', { class: 'muted' }, [place.admin1, place.country].filter(Boolean).join(', '))))
          : [el('p', { class: 'field-hint' }, 'Geen plaatsen gevonden.')];
      } catch {
        content = [el('p', { class: 'field-hint' }, 'Zoeken lukt nu niet. Controleer je internetverbinding.')];
      }
      if (run === placeSearchRun && results.isConnected) results.replaceChildren(...content);
    }, 300);

    /* ======================================================================
       Instellingen
       Het formulier werkt op `draft`, een kopie van de config. Pas bij Opslaan
       wordt die gecontroleerd, opgeschoond en bewaard.
       ====================================================================== */
    const SETTINGS_RENDERERS = {
      general: renderGeneralSettings,
      appearance: renderAppearanceSettings,
      tiles: renderTileSettings,
      quickLinks: renderQuickLinkSettings,
      weather: renderWeatherSettings,
      services: renderServiceSettings,
      data: renderDataSettings
    };

    const SETTINGS_ACTIONS = {
      'cancel-settings': cancelSettings,
      'save-settings': saveSettings,
      'export-config': exportConfig,
      'import-config': () => $('#importFile').click(),
      'reset-config': resetConfig,
      'add-tile': addTile,
      'edit-tile': button => openTileEditor(button.dataset.id),
      'close-tile-editor': () => openTileEditor(null),
      'add-link': button => {
        getPath(draft, button.dataset.list).push({ label: '', url: '' });
        rerenderSettings();
      },
      'move-item': moveItem,
      'remove-item': removeItem,
      'set-accent': button => {
        draft.appearance.accentColor = button.dataset.color;
        applyAppearance(draft.appearance);
        rerenderSettings();
      },
      'test-worker': testWorkerConnection,
      'set-tile-icon': button => {
        setPath(draft, button.dataset.path, button.dataset.icon);
        rerenderSettings();
      },
      'choose-place': button => {
        draft.weather.location = {
          name: button.dataset.name,
          latitude: Number(button.dataset.latitude),
          longitude: Number(button.dataset.longitude)
        };
        rerenderSettings();
      },
      'clear-image': button => {
        setPath(draft, button.dataset.path, '');
        applyAppearance(draft.appearance);
        rerenderSettings();
      }
    };

    const IMAGE_SETTINGS = {
      logo: { path: 'general.logo.dataUrl', maxSize: 320, type: 'image/png' },
      background: { path: 'appearance.background.image', maxSize: 1920, type: 'image/jpeg', quality: 0.82 }
    };

    function openSettings(sectionId = activeSettingsSection) {
      draft = structuredClone(config);
      editingTileId = null;
      renderSettingsNav();
      renderSettingsSection(sectionId);
      $('#settingsPanel').scrollTop = 0;
      $('#settingsModal').showModal();
    }

    function closeSettings() {
      draft = null;
      editingTileId = null;
      $('#settingsModal').close();
    }

    function cancelSettings() {
      if (isDraftDirty() && !confirm('Je wijzigingen zijn nog niet opgeslagen. Toch sluiten?')) return;
      closeSettings();
      applyAppearance(); // live voorbeeld terugdraaien
    }

    function isDraftDirty() {
      return Boolean(draft) && JSON.stringify(draft) !== JSON.stringify(config);
    }

    function saveSettings() {
      const problem = validateDraft(draft);
      if (problem) {
        editingTileId = problem.tileId ?? null;
        renderSettingsSection(problem.section);
        toast(problem.message);
        return;
      }
      applyConfig(normalizeConfig(draft));
      closeSettings();
      toast('De instellingen zijn opgeslagen.');
    }

    function validateDraft(data) {
      const { gridColumns, gridRows } = data.appearance;
      const capacity = gridColumns * gridRows;
      const used = countCells(data.tiles);
      if (used > capacity) {
        return {
          section: 'tiles',
          message: `De tegels hebben ${used} cellen nodig, maar het grid heeft er ${capacity}. ` +
            'Maak het grid groter (Uiterlijk) of verwijder tegels.'
        };
      }
      for (const tile of data.tiles) {
        const problem = validateTile(tile);
        if (problem) {
          return { section: 'tiles', tileId: tile.id, message: `Tegel "${tile.title || TILE_TYPES[tile.type].label}": ${problem}` };
        }
      }
      if (data.quickLinks.items.some(link => !safeUrl(link.url, LINK_PROTOCOLS))) {
        return { section: 'quickLinks', message: 'Een van de snelle links heeft geen geldig adres. Begin het adres met https://.' };
      }
      if (data.general.logo.source === 'url' && !resolveLogo(data.general.logo)) {
        return { section: 'general', message: 'Vul een geldig adres of pad in voor het logo.' };
      }
      if (data.services.workerUrl && !safeUrl(data.services.workerUrl, ['https:'])) {
        return { section: 'services', message: 'Het Worker-adres moet met https:// beginnen.' };
      }
      return null;
    }

    function validateTile(tile) {
      if (tile.type === 'link') {
        const { kind, value } = tile.target;
        if (kind === 'url' && !safeUrl(value, LINK_PROTOCOLS)) return 'vul een geldig webadres in, beginnend met https://.';
        if (kind === 'path' && !pathToFileUrl(value)) return 'vul een geldig pad in, bijvoorbeeld C:\\Users\\…\\Rapport.pdf.';
      }
      if (tile.type === 'links' && tile.links.some(link => !safeUrl(link.url, LINK_PROTOCOLS))) {
        return 'een van de links heeft geen geldig adres.';
      }
      if (tile.type === 'rss' && tile.feedUrl && !safeUrl(tile.feedUrl, ['http:', 'https:'])) return 'het feed-adres is ongeldig.';
      if (tile.type === 'calendar' && tile.icsUrl && !safeUrl(tile.icsUrl, ['https:'])) {
        return 'het iCal-adres moet met https:// beginnen.';
      }
      return null;
    }

    function renderSettingsNav() {
      $('#settingsNav').replaceChildren(...SETTINGS_SECTIONS.map(section =>
        el('button', { class: 'settings-nav-item', type: 'button', 'data-section': section.id }, section.label)));
    }

    function renderSettingsSection(sectionId) {
      const section = SETTINGS_SECTIONS.find(item => item.id === sectionId) ?? SETTINGS_SECTIONS[0];
      const panel = $('#settingsPanel');
      const scrollTop = section.id === activeSettingsSection ? panel.scrollTop : 0;
      activeSettingsSection = section.id;

      for (const button of $('#settingsNav').children) {
        if (button.dataset.section === section.id) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      }

      panel.replaceChildren(
        el('h3', {}, section.label),
        el('p', { class: 'muted' }, section.description),
        ...SETTINGS_RENDERERS[section.id]());
      panel.scrollTop = scrollTop;
    }

    function rerenderSettings() {
      renderSettingsSection(activeSettingsSection);
    }

    function handleSettingsInput(event) {
      const control = event.target;
      if (control.id === 'placeSearch') searchPlaces(control.value);
      const path = control.dataset.path;
      if (!path || !draft) return;
      setPath(draft, path, readControl(control));

      if (path.startsWith('appearance.')) applyAppearance(draft.appearance);
      // Ander soort doel: het oude adres of pad past daar niet meer bij.
      if (path.endsWith('.target.kind')) setPath(draft, path.replace(/kind$/, 'value'), '');
      if (path.endsWith('.target.value')) {
        const officeOption = $('[data-office-option]', $('#settingsPanel'));
        if (officeOption) officeOption.hidden = !officeUri(pathToFileUrl(control.value) ?? '');
      }
    }

    async function handleSettingsChange(event) {
      const control = event.target;
      if (!draft) return;
      if (control.dataset.image) {
        await loadImageSetting(control);
      } else if (control.dataset.colorToggle) {
        setPath(draft, control.dataset.colorToggle, control.checked ? draft.appearance.accentColor : '');
      }
      if (control.matches('[data-image], [data-color-toggle], [data-rerender]')) rerenderSettings();
    }

    function readControl(control) {
      if (control.type === 'checkbox') return control.checked;
      if (control.type === 'number' || control.dataset.type === 'number') return Number(control.value);
      return control.value;
    }

    async function loadImageSetting(control) {
      const [file] = control.files;
      const setting = IMAGE_SETTINGS[control.dataset.image];
      if (!file || !setting) return;
      try {
        setPath(draft, setting.path, await readImage(file, setting));
        applyAppearance(draft.appearance);
      } catch {
        toast(`"${file.name}" kon niet als afbeelding worden gelezen.`);
      }
    }

    function addTile() {
      const type = $('#newTileType').value;
      const meta = TILE_TYPES[type];
      const { gridColumns, gridRows } = draft.appearance;
      if (countCells(draft.tiles) + meta.cells > gridColumns * gridRows) {
        toast(`Er is geen ruimte meer voor een ${meta.label.toLowerCase()}. ` +
          'Maak het grid groter via Uiterlijk, of verwijder een tegel.');
        return;
      }
      const tile = { id: uid(), type, ...structuredClone(TILE_DEFAULTS[type]), title: meta.defaultTitle, icon: meta.icon };
      draft.tiles.push(tile);
      openTileEditor(tile.id);
    }

    function openTileEditor(tileId) {
      editingTileId = tileId;
      renderSettingsSection('tiles');
      $('#settingsPanel').scrollTop = 0;
    }

    function moveItem(button) {
      const list = getPath(draft, button.dataset.list);
      const from = Number(button.dataset.index);
      const to = from + Number(button.dataset.dir);
      if (to < 0 || to >= list.length) return;
      [list[from], list[to]] = [list[to], list[from]];
      rerenderSettings();
    }

    function removeItem(button) {
      const list = getPath(draft, button.dataset.list);
      const [removed] = list.splice(Number(button.dataset.index), 1);
      if (removed?.id === editingTileId) editingTileId = null;
      rerenderSettings();
    }

    /* ---------- Formulierbouwstenen ---------- */
    function buildSettingsGroup(title, description, ...content) {
      return el('section', { class: 'settings-group' },
        el('h4', {}, title),
        description ? el('p', {}, description) : null,
        el('div', { class: 'settings-group-content' }, content));
    }

    // Een <label> rond één invoerveld maakt het hele label klikbaar; samengestelde velden krijgen een <div>.
    function field(label, control, hint) {
      const single = control instanceof HTMLInputElement || control instanceof HTMLSelectElement;
      return el(single ? 'label' : 'div', { class: 'field' },
        el('span', { class: 'field-label' }, label),
        control,
        hint ? el('span', { class: 'field-hint' }, hint) : null);
    }

    function inputFor(path, attributes = {}) {
      return el('input', { type: 'text', value: getPath(draft, path), 'data-path': path, ...attributes });
    }

    function selectFor(path, options, attributes = {}) {
      const current = String(getPath(draft, path));
      return el('select', { 'data-path': path, ...attributes },
        options.map(([value, label]) => el('option', { value, selected: String(value) === current }, label)));
    }

    function checkbox(path, label) {
      return el('label', { class: 'check' },
        el('input', { type: 'checkbox', 'data-path': path, checked: Boolean(getPath(draft, path)) }),
        el('span', {}, label));
    }

    function miniButton(iconName, label, attributes) {
      return el('button', { class: 'mini-btn', type: 'button', title: label, 'aria-label': label, ...attributes }, icon(iconName));
    }

    function listControls(listPath, index, length, label) {
      const item = { 'data-list': listPath, 'data-index': index };
      return el('span', { class: 'row-actions' },
        miniButton('up', `${label} omhoog`, { ...item, 'data-action': 'move-item', 'data-dir': -1, disabled: index === 0 }),
        miniButton('down', `${label} omlaag`, { ...item, 'data-action': 'move-item', 'data-dir': 1, disabled: index === length - 1 }),
        miniButton('trash', `${label} verwijderen`, { ...item, 'data-action': 'remove-item' }));
    }

    function buildLinkRows(listPath, items) {
      return [
        items.length
          ? el('div', { class: 'rows' }, items.map((link, index) => el('div', { class: 'link-row' },
              inputFor(`${listPath}.${index}.label`, { placeholder: 'Naam', 'aria-label': `Naam van link ${index + 1}` }),
              inputFor(`${listPath}.${index}.url`, { type: 'url', placeholder: 'https://…', 'aria-label': `Adres van link ${index + 1}` }),
              listControls(listPath, index, items.length, `Link ${index + 1}`))))
          : el('p', { class: 'field-hint' }, 'Nog geen links.'),
        el('button', { class: 'btn', type: 'button', 'data-action': 'add-link', 'data-list': listPath }, icon('plus'), 'Link toevoegen')
      ];
    }

    function imageField(kind, current, path) {
      const hasImage = isImageDataUrl(current);
      return field('Afbeelding',
        el('div', { class: 'inline' },
          hasImage ? el('img', { class: 'image-preview', src: current, alt: '' }) : null,
          el('input', { type: 'file', accept: 'image/*', 'data-image': kind, 'aria-label': 'Afbeelding kiezen' }),
          hasImage ? el('button', { class: 'btn', type: 'button', 'data-action': 'clear-image', 'data-path': path }, 'Verwijderen') : null),
        `Wordt verkleind tot maximaal ${IMAGE_SETTINGS[kind].maxSize} pixels en in je instellingen bewaard.`);
    }

    function colorField(tile, base) {
      return field('Kleur',
        el('div', { class: 'inline' },
          el('label', { class: 'check' },
            el('input', { type: 'checkbox', 'data-color-toggle': `${base}.color`, checked: Boolean(tile.color) }),
            el('span', {}, 'Eigen kleur')),
          tile.color ? inputFor(`${base}.color`, { type: 'color', 'aria-label': 'Tegelkleur' }) : null),
        'Zonder eigen kleur gebruikt de tegel de accentkleur.');
    }

    /* ---------- Secties ---------- */
    function renderGeneralSettings() {
      const { logo } = draft.general;
      return [
        buildSettingsGroup('Titel en welkomsttekst', null,
          field('Titel', inputFor('general.title', { maxlength: 60 })),
          checkbox('general.showWelcome', 'Welkomsttekst tonen'),
          field('Welkomsttekst', inputFor('general.welcomeText', { maxlength: 120 }),
            '{dagdeel} wordt vervangen door Goedemorgen, Goedemiddag, Goedenavond of Goedenacht.')),
        buildSettingsGroup('Logo', 'Wordt links in de kopbalk getoond.',
          field('Logo', selectFor('general.logo.source', LOGO_SOURCES, { 'data-rerender': true })),
          logo.source === 'url'
            ? field('Adres of pad', inputFor('general.logo.url', { placeholder: 'https://… of C:\\Users\\…\\logo.png' }))
            : null,
          logo.source === 'upload' ? imageField('logo', logo.dataUrl, 'general.logo.dataUrl') : null)
      ];
    }

    function renderAppearanceSettings() {
      const { appearance } = draft;
      const gridOptions = [[2, '2'], [3, '3'], [4, '4']];
      return [
        buildSettingsGroup('Thema en kleur', null,
          field('Thema', selectFor('appearance.theme', [
            ['system', 'Systeem (volgt Windows)'], ['light', 'Licht'], ['dark', 'Donker']
          ])),
          field('Accentkleur', el('div', { class: 'swatches' },
            ACCENT_PRESETS.map(color => el('button', {
              class: 'swatch',
              type: 'button',
              style: { '--swatch': color },
              'data-action': 'set-accent',
              'data-color': color,
              'aria-label': `Accentkleur ${color}`,
              'aria-pressed': String(color === appearance.accentColor)
            })),
            inputFor('appearance.accentColor', { type: 'color', 'aria-label': 'Eigen accentkleur' })))),
        buildSettingsGroup('Achtergrond', 'Geldt voor het lichte en het donkere thema.',
          field('Achtergrond', selectFor('appearance.background.type', BACKGROUND_TYPES, { 'data-rerender': true })),
          appearance.background.type === 'color'
            ? field('Kleur', inputFor('appearance.background.color', { type: 'color' }))
            : null,
          appearance.background.type === 'image'
            ? imageField('background', appearance.background.image, 'appearance.background.image')
            : null),
        buildSettingsGroup('Grid en tegels',
          `Ruimte voor ${appearance.gridColumns * appearance.gridRows} cellen; de agenda gebruikt er 4.`,
          el('div', { class: 'inline' },
            field('Kolommen', selectFor('appearance.gridColumns', gridOptions, { 'data-type': 'number', 'data-rerender': true })),
            field('Rijen', selectFor('appearance.gridRows', gridOptions, { 'data-type': 'number', 'data-rerender': true }))),
          field('Tegelstijl', selectFor('appearance.tileStyle', [['rounded', 'Afgerond'], ['square', 'Vierkant']]))),
        buildSettingsGroup('Favicons',
          'Kleine logo\'s bij snelle links en links in een link-tegel. Ze komen van DuckDuckGo, Google of de site zelf; ' +
          'daardoor zien die diensten welke websites in je links staan.',
          checkbox('appearance.favicons', 'Favicons tonen'))
      ];
    }

    function renderTileSettings() {
      if (editingTileId) {
        const index = draft.tiles.findIndex(tile => tile.id === editingTileId);
        if (index >= 0) return renderTileEditor(index);
        editingTileId = null;
      }

      const { gridColumns, gridRows } = draft.appearance;
      const capacity = gridColumns * gridRows;
      const used = countCells(draft.tiles);
      return [
        el('p', { class: `capacity${used > capacity ? ' is-over' : ''}` },
          `${used} van ${capacity} cellen gebruikt (grid ${gridColumns} × ${gridRows}).`),
        draft.tiles.length
          ? el('ul', { class: 'settings-list' }, draft.tiles.map((tile, index) => el('li', { class: 'settings-list-item' },
              el('span', { class: 'item-icon', 'aria-hidden': 'true' }, buildTileGlyph(tile) ?? initial(tile.title)),
              el('button', { class: 'item-main', type: 'button', 'data-action': 'edit-tile', 'data-id': tile.id },
                el('span', { class: 'item-title' }, tile.title || '(zonder titel)'),
                el('span', { class: 'item-meta' }, describeTile(tile))),
              miniButton('edit', `${tile.title || 'Tegel'} bewerken`, { 'data-action': 'edit-tile', 'data-id': tile.id }),
              listControls('tiles', index, draft.tiles.length, tile.title || 'Tegel'))))
          : el('p', { class: 'muted' }, 'Nog geen tegels.'),
        el('div', { class: 'inline add-row' },
          el('select', { id: 'newTileType', 'aria-label': 'Soort tegel' },
            Object.entries(TILE_TYPES).map(([type, meta]) => el('option', { value: type }, meta.label))),
          el('button', { class: 'btn btn--primary', type: 'button', 'data-action': 'add-tile' }, icon('plus'), 'Tegel toevoegen'))
      ];
    }

    function describeTile(tile) {
      if (tile.type === 'link') {
        const { kind, value } = tile.target;
        return kind === 'session-file' ? TARGET_KINDS[kind] : `${TARGET_KINDS[kind] ?? 'Doel'}: ${value || '—'}`;
      }
      if (tile.type === 'links') return `${TILE_TYPES.links.label} · ${tile.links.length} links`;
      if (tile.type === 'rss') return `${TILE_TYPES.rss.label} · ${tile.feedUrl || 'nog geen adres'}`;
      return `${TILE_TYPES.calendar.label} · ${tile.icsUrl ? 'agenda gekoppeld' : 'nog geen agenda-adres'}`;
    }

    const TILE_EDITORS = {
      link: (tile, base) => {
        const { kind, value } = tile.target;
        const isOffice = kind === 'path' && Boolean(officeUri(pathToFileUrl(value) ?? ''));
        return [
          field('Doel', selectFor(`${base}.target.kind`, Object.entries(TARGET_KINDS), { 'data-rerender': true })),
          kind === 'url'
            ? field('Webadres', inputFor(`${base}.target.value`, { type: 'url', placeholder: 'https://…' }))
            : null,
          kind === 'path'
            ? field('Pad', inputFor(`${base}.target.value`, { placeholder: 'C:\\Users\\…\\Rapport.pdf of \\\\server\\share\\map' }),
                'Tip: klik in Verkenner met rechts op een bestand of map en kies "Als pad kopiëren". Een map toont Edge als lijst.')
            : null,
          kind === 'path'
            ? el('div', { class: 'office-option', 'data-office-option': true, hidden: !isOffice },
                checkbox(`${base}.openInApp`, 'Openen in Word, Excel of PowerPoint (experimenteel)'),
                el('p', { class: 'field-hint' },
                  'Edge vraagt eerst toestemming om het programma te openen. Werkt het niet, zet dit dan uit: ' +
                  'Edge downloadt het bestand dan. Het pad kopiëren kan altijd via de knop op de tegel.'))
            : null,
          kind === 'session-file'
            ? el('p', { class: 'field-hint' },
                'Je kiest het bestand bij de eerste klik op de tegel. Na herladen van de pagina kies je het opnieuw: ' +
                'browsers mogen een gekozen bestand niet onthouden. Gebruik "Lokaal bestand of map" om een vast pad te bewaren.')
            : null,
          colorField(tile, base)
        ];
      },
      links: (tile, base) => [
        el('div', { class: 'field field--wide' },
          el('span', { class: 'field-label' }, 'Links'),
          buildLinkRows(`${base}.links`, tile.links))

      rss: (tile, base) => [
        field('Feed-adres', inputFor(`${base}.feedUrl`, { type: 'url', placeholder: 'https://…/rss' }),

        field('Aantal berichten', inputFor(`${base}.maxItems`, { type: 'number', min: 1, max: 30, class: 'input-short' }))
      ],
      calendar: (tile, base) => [
        field('iCal-adres', inputFor(`${base}.icsUrl`, {
          type: 'url',

        }), 'Google Agenda → Instellingen → jouw agenda → Agenda integreren → "Geheim adres in iCal-indeling". ' +
          'Behandel dit adres als een wachtwoord.'),
        field('Dagen vooruit', inputFor(`${base}.daysAhead`, { type: 'number', min: 1, max: 90, class: 'input-short' }))

    function renderTileEditor(index) {
      const tile = draft.tiles[index];
      const base = `tiles.${index}`;
      return [
        el('button', { class: 'btn back-btn', type: 'button', 'data-action': 'close-tile-editor' }, icon('back'), 'Alle tegels'),
        buildSettingsGroup(`${TILE_TYPES[tile.type].label} bewerken`, null,
          field('Titel', inputFor(`${base}.title`, { maxlength: 60 })),
          buildIconPicker(tile, base),
          field('Of een eigen teken', el('input', {
            type: 'text',
            class: 'input-short',
            value: TILE_ICONS[tile.icon] ? '' : tile.icon,
            'data-path': `${base}.icon`,
            maxlength: 8,
            placeholder: 'bijv. ★'
          }), 'Een emoji of teken, in grijstinten getoond. Windows-toets + punt opent de emoji-kiezer.'),
          TILE_EDITORS[tile.type](tile, base)),
        el('div', { class: 'inline editor-footer' },
          el('button', { class: 'btn btn--primary', type: 'button', 'data-action': 'close-tile-editor' }, 'Klaar'),
          el('button', {
            class: 'btn btn--danger',
            type: 'button',
            'data-action': 'remove-item',
            'data-list': 'tiles',
            'data-index': index
          }, icon('trash'), 'Tegel verwijderen'))
      ];
    }

    function buildIconPicker(tile, base) {
      const choice = (name, label, content, extraClass = '') => el('button', {
        class: `icon-choice${extraClass}`,
        type: 'button',
        'data-action': 'set-tile-icon',
        'data-path': `${base}.icon`,
        'data-icon': name,
        'aria-pressed': String(tile.icon === name),
        title: label,
        'aria-label': label
      }, content);

      return field('Icoon',
        el('div', { class: 'icon-picker', role: 'group', 'aria-label': 'Icoon kiezen' },
          choice('', 'Geen icoon: de eerste letter van de titel', 'Abc', ' icon-choice--none'),
          Object.entries(TILE_ICONS).map(([name, [label]]) => choice(name, label, icon(name)))));
    }

    function renderQuickLinkSettings() {
      return [
        buildSettingsGroup('Balk', null, checkbox('quickLinks.enabled', 'Balk met snelle links tonen')),
        buildSettingsGroup('Links', 'Ze verschijnen in deze volgorde onder het grid.',
          buildLinkRows('quickLinks.items', draft.quickLinks.items))
      ];
    }

    function renderWeatherSettings() {
      return [
        buildSettingsGroup('Weer', null,
          checkbox('weather.enabled', 'Weer tonen in de kopbalk'),
          field('Plaats', el('div', { class: 'place-search' },
            el('p', { class: 'static-value' }, `Gekozen: ${draft.weather.location.name}`),
            el('input', {
              id: 'placeSearch',
              type: 'search',
              placeholder: 'Zoek een plaats, bijvoorbeeld Utrecht',
              autocomplete: 'off',
              'aria-label': 'Plaats zoeken',
              'aria-controls': 'placeResults'
            }),
            el('div', { id: 'placeResults', class: 'place-results', 'aria-live': 'polite' })),
            'Het weer komt van Open-Meteo en wordt elke 30 minuten bijgewerkt.'),
          field('Eenheid', selectFor('weather.unit', [['celsius', 'Celsius (°C)'], ['fahrenheit', 'Fahrenheit (°F)']]))),
        buildSettingsGroup('Klok', null,
          checkbox('clock.enabled', 'Klok tonen'),
          checkbox('clock.showSeconds', 'Seconden tonen'),
          checkbox('clock.showDate', 'Datum tonen'))
      ];
    }

    function renderServiceSettings() {
      return [
        buildSettingsGroup('Cloudflare Worker',
          'De Worker haalt RSS-feeds en je agenda op. Hoe je hem in je Cloudflare-account zet, staat in ' +
          'worker/README.md in het project.',
          field('Worker-adres', inputFor('services.workerUrl', {
            type: 'url',
            placeholder: 'https://landingspagina.<jouw-subdomein>.workers.dev'
          })),
          field('Sleutel', inputFor('services.workerKey', { type: 'password', autocomplete: 'off' }),
            'Dezelfde waarde als het secret DASHBOARD_KEY van de Worker.'),
          el('div', { class: 'inline' },
            el('button', { class: 'btn', type: 'button', 'data-action': 'test-worker' }, 'Verbinding testen'),
            el('p', { id: 'workerStatus', class: 'status', role: 'status' })))
      ];
    }

    // Test met de waarden uit het formulier, dus ook vóór het opslaan.
    async function testWorkerConnection() {
      const status = $('#workerStatus');
      const show = (message, state = '') => {
        status.textContent = message;
        status.dataset.state = state;
      };
      if (!safeUrl(draft.services.workerUrl, ['https:'])) {
        show('Vul eerst een Worker-adres in dat met https:// begint.', 'error');
        return;
      }
      show('Verbinding testen…');
      try {
        const response = await fetch(workerEndpoint(draft.services, '/ping'), {
          headers: { 'X-Dashboard-Key': draft.services.workerKey },
          signal: AbortSignal.timeout(10_000)
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.ok) show(`Verbinding gelukt (Worker-versie ${data.version}).`, 'ok');
        else if (response.status === 401) show('De Worker is bereikbaar, maar de sleutel klopt niet.', 'error');
        else show(data.error ?? `De Worker gaf status ${response.status}.`, 'error');
      } catch {
        show('De Worker is niet bereikbaar. Controleer het adres en je internetverbinding.', 'error');
      }
    }

    function renderDataSettings() {
      const usage = el('dd', {}, '…');
      const backup = el('dd', {}, '…');
      const persisted = el('dd', {}, '…');
      fillStorageFacts({ usage, backup, persisted });

      return [
        buildSettingsGroup('Exporteren',
          'Download al je opgeslagen instellingen als bestand, als back-up of om over te zetten naar een andere computer. ' +
          'Het bestand bevat ook je agenda-adres en de Worker-sleutel: bewaar het op een veilige plek.',
          el('button', { class: 'btn btn--primary', type: 'button', 'data-action': 'export-config' }, 'Exporteren')),
        buildSettingsGroup('Importeren',
          'Zet instellingen terug uit een eerder geëxporteerd bestand. Je huidige instellingen worden vervangen.',
          el('button', { class: 'btn', type: 'button', 'data-action': 'import-config' }, 'Bestand kiezen…')),
        buildSettingsGroup('Standaardinstellingen',
          'Zet alles terug naar de standaard. Exporteer eerst als je je huidige instellingen wilt bewaren.',
          el('button', { class: 'btn btn--danger', type: 'button', 'data-action': 'reset-config' }, 'Terugzetten')),
        buildSettingsGroup('Opslag',
          'Je instellingen staan in deze browser op deze computer, niet in het bestand zelf. ' +
          'Let op: "Browsegegevens wissen → Cookies en andere sitegegevens" in Edge wist ze ook.',
          el('dl', { class: 'facts' },
            el('dt', {}, 'Gebruikte opslag'), usage,
            el('dt', {}, 'Back-up (IndexedDB)'), backup,
            el('dt', {}, 'Beschermd tegen opruimen'), persisted))
      ];
    }

    async function fillStorageFacts({ usage, backup, persisted }) {
      initDB().then(() => { backup.textContent = 'Actief'; }, () => { backup.textContent = 'Niet beschikbaar'; });
      try {
        const { usage: bytes } = await navigator.storage.estimate();
        usage.textContent = formatBytes(bytes);
      } catch {
        usage.textContent = 'Onbekend';
      }
      try {
        persisted.textContent = (await navigator.storage.persisted()) ? 'Ja' : 'Nee (Edge beslist dit zelf)';
      } catch {
        persisted.textContent = 'Onbekend';
      }
    }

    /* ======================================================================
       Hulpfuncties
       ====================================================================== */
    function $(selector, root = document) {
      return root.querySelector(selector);
    }

    // Veilige DOM-builder: tekst gaat altijd als tekstnode de pagina in, nooit als HTML.
    function el(tag, attributes = {}, ...children) {
      const node = document.createElement(tag);
      for (const [name, value] of Object.entries(attributes)) {
        if (value == null || value === false) continue;
        if (name === 'class') node.className = value;
        else if (name === 'style') {
          for (const [property, propertyValue] of Object.entries(value)) node.style.setProperty(property, propertyValue);
        } else node.setAttribute(name, value === true ? '' : value);
      }
      node.append(...children.flat(Infinity).filter(child => child != null && child !== false));
      return node;
    }

    function toast(message) {
      const node = $('#toast');
      node.textContent = message;
      // Opnieuw tonen zet de melding bovenaan de top layer, dus ook boven een open modal.
      if (node.matches(':popover-open')) node.hidePopover();
      node.showPopover();
      clearTimeout(timers.toast);
      timers.toast = setTimeout(() => node.hidePopover(), 4500);
    }

    function icon(name) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      svg.classList.add('icon');
      const path = document.createElementNS(svg.namespaceURI, 'path');
      path.setAttribute('d', ICON_PATHS[name] ?? TILE_ICONS[name][1]);
      svg.append(path);
      return svg;
    }

    function getPath(object, path) {
      return path.split('.').reduce((value, key) => value?.[key], object);
    }

    function setPath(object, path, value) {
      const keys = path.split('.');
      const last = keys.pop();
      keys.reduce((target, key) => target[key], object)[last] = value;
    }

    // "Als pad kopiëren" in Verkenner zet aanhalingstekens om het pad.
    function cleanPath(value) {
      return String(value).trim().replace(/^"(.*)"$/, '$1');
    }

    // C:\map\bestand.pdf → file:///C:/map/bestand.pdf, \\server\share\x → file://server/share/x
    function pathToFileUrl(value) {
      const path = cleanPath(value);
      if (/^file:\/\//i.test(path)) return safeUrl(path, ['file:']);
      const unc = path.match(/^[\\/]{2}([^\\/]+)[\\/]+(.+)$/);
      if (unc) return `file://${unc[1]}/${encodePath(unc[2])}`;
      const drive = path.match(/^([a-z]):(?:[\\/](.*))?$/i);
      if (drive) return `file:///${drive[1].toUpperCase()}:/${encodePath(drive[2] ?? '')}`;
      if (path.startsWith('/')) return `file://${encodePath(path)}`;
      return null;
    }

    function encodePath(path) {
      return path.split(/[\\/]+/).map(encodeURIComponent).join('/');
    }

    function officeUri(fileUrl) {
      const extension = fileUrl.split(/[?#]/)[0].split('.').pop().toLowerCase();
      const scheme = OFFICE_SCHEMES[extension];
      return scheme ? `${scheme}:ofe|u|${fileUrl}` : null;
    }

    // Verkleint een afbeelding en geeft een data-URL terug die in de config past.
    function readImage(file, { maxSize, type, quality }) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const width = image.naturalWidth || maxSize;
          const height = image.naturalHeight || maxSize;
          const scale = Math.min(1, maxSize / Math.max(width, height));
          const canvas = el('canvas', { width: Math.round(width * scale), height: Math.round(height * scale) });
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL(type, quality));
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Geen leesbare afbeelding'));
        };
        image.src = url;
      });
    }

    function isImageDataUrl(value) {
      return typeof value === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(value);
    }

    function isHexColor(value) {
      return /^#[0-9a-f]{6}$/i.test(value);
    }

    // "zojuist", "12 minuten geleden", "3 uur geleden", "gisteren", daarna een datum.
    function relativeTime(date, now = new Date()) {
      const minutes = Math.round((now - date) / 60_000);
      if (minutes < 1) return 'zojuist';
      if (minutes < 60) return RELATIVE_TIME_FORMAT.format(-minutes, 'minute');
      const hours = Math.round(minutes / 60);
      if (hours < 24) return RELATIVE_TIME_FORMAT.format(-hours, 'hour');
      const days = Math.round(hours / 24);
      if (days < 7) return RELATIVE_TIME_FORMAT.format(-days, 'day');
      return SHORT_DATE_FORMAT.format(date);
    }

    function debounce(callback, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => callback(...args), delay);
      };
    }

    function isPlainObject(value) {
      return typeof value === 'object' && value !== null && !Array.isArray(value);
    }

    function uid() {
      return crypto.randomUUID().slice(0, 8);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function dateStamp(date) {
      const pad = number => String(number).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function formatBytes(bytes) {
      const number = new Intl.NumberFormat('nl-NL', { maximumFractionDigits: 1 });
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${number.format(bytes / 1024)} kB`;
      return `${number.format(bytes / 1024 ** 2)} MB`;
    }

    function safeUrl(value, protocols) {
      try {
        const url = new URL(String(value).trim());
        return protocols.includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function initial(text) {
      return ([...String(text).trim()][0] ?? '?').toUpperCase();
    }

    function dayPartGreeting(date) {
      const hour = date.getHours();
      if (hour < 6) return 'Goedenacht';
      if (hour < 12) return 'Goedemorgen';
      if (hour < 18) return 'Goedemiddag';
      return 'Goedenavond';
    }

    /* ======================================================================
       Init
       ====================================================================== */
    async function init() {
      const { data, status } = loadData();
      config = data;
      renderDashboard();
      bindEvents();
      startClock();
      await syncBackup(status);
      updateWeather();
      updateFeeds();
      requestPersistentStorage();
    }

    init();
  </script>
